title: RobOS
tagline: AI-First SDLC Platform & Autonomous Agent Governance Harness
description: "The AI-first SDLC platform and autonomous agent governance harness with automated 1080p video proof-of-work, semantic blast-radius checking, and Knowledge Graph-First application generation. Model your architecture once and govern coding agents with zero workstation pollution."
url: "https://nddipiazza.github.io"
baseurl: "/robos"

# Open Graph / LinkedIn / Twitter preview
og_image: "/robos/assets/images/screenshots/robos-desktop.png"
twitter:
  card: summary_large_image

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

logo: "/assets/images/logo.png"

aux_links:
  "GitHub":
    - "https://github.com/nddipiazza/robos"
  "💬 Discord":
    - "https://discord.gg/6PjxzkHujE"
  "💡 Ideas Store":
    - "https://github.com/nddipiazza/robos/tree/main/docs/ideas"
  "🌱 About":
    - "https://nddipiazza.github.io/robos/about.html"

aux_links_new_tab: true

heading_anchors: true

nav_sort: case_insensitive

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "RobOS &mdash; AI-First SDLC Platform & Autonomous Agent Governance Harness. Built with <a href=\"https://github.com/nddipiazza/robos\">open source standards</a>. &bull; 💬 <a href=\"https://discord.gg/6PjxzkHujE\" target=\"_blank\" rel=\"noopener\">Discord Community</a> (<a href=\"https://discord.com/channels/1546926331193725029/\" target=\"_blank\" rel=\"noopener\">#general</a>) &bull; 💡 <a href=\"https://github.com/nddipiazza/robos/tree/main/docs/ideas\" target=\"_blank\" rel=\"noopener\">Ideas Store on GitHub</a>"

mermaid:
  version: "10.9.0"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - project-plan/
  - Gemfile
  - Gemfile.lock
