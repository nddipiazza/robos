name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity (needed by robos-store tests)
        run: |
          git config --global user.name "RobOS CI"
          git config --global user.email "ci@robos.dev"

      - name: Install test dependencies
        run: cd packages/robos-test && npm install

      - name: Run unit tests
        run: cd packages/robos-test && npm run test:unit

  # Build the RobOS Installer GUI for Linux
  build-installer-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: cd installer && npm install && npm run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            installer/dist/*.AppImage
            installer/dist/*.deb

  # Build the RobOS Installer GUI for macOS
  build-installer-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: cd installer && npm install && npm run build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: installer/dist/*.dmg

  # Build the RobOS Installer GUI for Windows
  build-installer-win:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: cd installer && npm install && npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: installer/dist/*.exe

  # Build OS images and create GitHub Release
  release:
    needs: [test, build-installer-linux, build-installer-mac, build-installer-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-utils xorriso

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build RobOS installer ISO
        run: bash infra/desktop/build-iso.sh

      - name: Build VM disk image and seed ISO
        run: cd infra/desktop && bash build.sh

      - name: Download installer builds
        uses: actions/download-artifact@v4
        with:
          path: installer-builds

      - name: Version the release artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release

          # Installer ISO (bootable — flash to USB)
          cp infra/desktop/output/robos.iso release/robos-v${VERSION}.iso

          # Packages tarball
          tar czf release/robos-v${VERSION}-packages.tar.gz \
            --exclude='node_modules' --exclude='.git' --exclude='__pycache__' \
            -C packages .

          # Seed ISO (cloud-init for VMs)
          cp infra/desktop/output/seed.iso release/robos-v${VERSION}-seed.iso

          # VM disk image
          cp infra/desktop/output/robos.qcow2 release/robos-v${VERSION}.qcow2

          # Installer GUI builds — rename with version
          for f in installer-builds/installer-linux/*.AppImage; do
            [ -f "$f" ] && cp "$f" release/RobOS-Installer-v${VERSION}-linux.AppImage
          done
          for f in installer-builds/installer-linux/*.deb; do
            [ -f "$f" ] && cp "$f" release/RobOS-Installer-v${VERSION}-linux.deb
          done
          for f in installer-builds/installer-mac/*.dmg; do
            [ -f "$f" ] && cp "$f" release/RobOS-Installer-v${VERSION}-mac.dmg
          done
          for f in installer-builds/installer-win/*.exe; do
            [ -f "$f" ] && cp "$f" release/RobOS-Installer-v${VERSION}-win.exe
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum robos-v* RobOS-Installer-* > SHA256SUMS 2>/dev/null || sha256sum robos-v* > SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## RobOS v${VERSION}"
            echo ""
            echo "### Install RobOS"
            echo ""
            echo "**Easiest: Use the RobOS Installer app** (recommended)"
            echo ""
            echo "Download the installer for your OS, run it, select your USB drive, and click Flash:"
            echo ""
            echo "| OS | Download |"
            echo "|:---|:---------|"
            echo "| Linux | \`RobOS-Installer-v${VERSION}-linux.AppImage\` or \`.deb\` |"
            echo "| macOS | \`RobOS-Installer-v${VERSION}-mac.dmg\` |"
            echo "| Windows | \`RobOS-Installer-v${VERSION}-win.exe\` |"
            echo ""
            echo "**Alternative: Flash the ISO manually**"
            echo ""
            echo '```bash'
            echo "# Linux"
            echo "sudo dd if=robos-v${VERSION}.iso of=/dev/sdX bs=4M status=progress"
            echo ""
            echo "# macOS — use balenaEtcher"
            echo "# Windows — use Rufus"
            echo '```'
            echo ""
            echo "Then boot from USB. RobOS installs unattended in ~15 minutes."
            echo ""
            echo "**For VMs:** Download \`robos-v${VERSION}.qcow2\` + \`robos-v${VERSION}-seed.iso\` and boot with QEMU."
            echo ""
            echo "### Release Assets"
            echo ""
            echo "| File | Description |"
            echo "|:-----|:------------|"
            echo "| \`RobOS-Installer-*\` | GUI installer app (Linux AppImage/deb, macOS dmg, Windows exe) |"
            echo "| \`robos-v${VERSION}.iso\` | Bootable installer ISO — flash to USB, installs RobOS unattended |"
            echo "| \`robos-v${VERSION}.qcow2\` | Ready-to-boot VM disk image |"
            echo "| \`robos-v${VERSION}-seed.iso\` | Cloud-init seed ISO for VM provisioning |"
            echo "| \`robos-v${VERSION}-packages.tar.gz\` | All RobOS Electron app packages |"
            echo "| \`SHA256SUMS\` | Checksums for all artifacts |"
            echo ""
            echo "### What's New"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --oneline --no-decorate
            else
              echo "Initial release."
              echo ""
              git log --oneline --no-decorate -20
            fi
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo ""
            echo "### System Requirements"
            echo ""
            echo "- Any x86_64 PC/laptop with 16 GB+ RAM and 100 GB+ disk"
            echo "- USB flash drive (4 GB+) for bare-metal install"
            echo "- Or: QEMU/KVM for VM usage"
            echo ""
            echo "**[Documentation](https://nddipiazza.github.io/robos/)** | **[Getting Started](https://nddipiazza.github.io/robos/getting-started.html)**"
          } > release/RELEASE-NOTES.md

          {
            echo 'body<<EOFNOTES'
            cat release/RELEASE-NOTES.md
            echo 'EOFNOTES'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RobOS v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release/RobOS-Installer-*
            release/robos-v${{ steps.version.outputs.version }}.iso
            release/robos-v${{ steps.version.outputs.version }}.qcow2
            release/robos-v${{ steps.version.outputs.version }}-seed.iso
            release/robos-v${{ steps.version.outputs.version }}-packages.tar.gz
            release/SHA256SUMS
            release/RELEASE-NOTES.md
