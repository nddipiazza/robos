<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>RobOS People Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="/usr/local/share/robos/robos-icons/builtin-apps-browser.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="app-logo" id="app-logo-icon"></span>
      <span class="logo">People</span>
        <button id="btn-add" title="Add person">＋</button>
      </div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Search name, email, title…">
      </div>
      <div id="filter-bar">
        <select id="filter-dept"><option value="">All departments</option></select>
      </div>
      <ul id="people-list"></ul>
      <div id="sidebar-footer">
        <button id="btn-import" title="Import LDIF">Import LDIF</button>
        <button id="btn-settings" title="Backend settings">⚙</button>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main">
      <div id="empty-state">
        <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></div>
        <div class="empty-title">No person selected</div>
        <div class="empty-sub">Select someone from the list or add a new person.</div>
      </div>
      <div id="profile" class="hidden"></div>
      <div id="edit-panel" class="hidden"></div>
    </main>
  </div>

  <!-- Import LDIF modal -->
  <div id="import-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">Import LDIF <button id="import-modal-close">✕</button></div>
      <textarea id="ldif-text" placeholder="Paste LDIF content here…"></textarea>
      <div class="modal-actions">
        <button id="btn-do-import" class="btn-primary">Import</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">Backend Settings <button id="settings-modal-close">✕</button></div>
      <div class="form-row">
        <label>Backend</label>
        <select id="cfg-backend">
          <option value="filesystem">Filesystem (local JSON)</option>
          <option value="ldap">LDAP / Active Directory</option>
        </select>
      </div>
      <div id="ldap-fields" class="hidden">
        <div class="form-row"><label>LDAP URL</label><input id="cfg-url" type="text" placeholder="ldap://your-server:389"></div>
        <div class="form-row"><label>Base DN</label><input id="cfg-basedn" type="text" placeholder="dc=example,dc=com"></div>
        <div class="form-row"><label>Bind DN</label><input id="cfg-binddn" type="text" placeholder="cn=admin,dc=example,dc=com"></div>
        <div class="form-row"><label>Bind password (pass path)</label><input id="cfg-bindpass" type="text" placeholder="ldap/admin"></div>
        <div class="form-row"><label>User search base</label><input id="cfg-searchbase" type="text" placeholder="ou=People,dc=example,dc=com"></div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-settings" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
