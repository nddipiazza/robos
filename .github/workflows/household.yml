name: Household lifecycle

on:
  push:
    paths: ['packages/household/**', 'packages/robos-tax/**', '.github/workflows/household.yml']
  pull_request:
    paths: ['packages/household/**', 'packages/robos-tax/**', '.github/workflows/household.yml']

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/household
    env:
      HOUSEHOLD_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/household/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r requirements.txt -r ../robos-tax/requirements-dev.txt
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
      - run: npm --prefix ../robos-tax test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: household-lifecycle-screenshots
          path: site/assets/family-finances/*.png
          if-no-files-found: error
