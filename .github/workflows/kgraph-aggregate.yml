name: KGraph aggregate
on:
  push:
    branches: [main]
    paths: ['.robos/**', 'packages/robos-graph/lib/**', 'packages/robos-test/tests/kgraph-aggregate/**', 'packages/robos-test/tests/sdlc-graph/import-validity.test.js', '**/skills/import-company-kgraph/scripts/**', '.github/workflows/kgraph-aggregate.yml']
  pull_request:
    paths: ['.robos/**', 'packages/robos-graph/lib/**', 'packages/robos-test/tests/kgraph-aggregate/**', 'packages/robos-test/tests/sdlc-graph/import-validity.test.js', '**/skills/import-company-kgraph/scripts/**', '.github/workflows/kgraph-aggregate.yml']
permissions:
  contents: read
jobs:
  aggregate-matches-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the aggregate against the package files, and that the repository graph validates
        run: node --test packages/robos-test/tests/kgraph-aggregate/unit.test.js
      - name: Check that import results validate
        run: node --test packages/robos-test/tests/sdlc-graph/import-validity.test.js
