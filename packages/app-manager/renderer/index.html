<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"><title>RobOS App Manager</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand"><img src="../icon.svg" alt=""> <span>RobOS<small>APP MANAGER</small></span></div><p class="eyebrow">YOUR WORKSPACE</p><button id="browse" class="nav active">▦ &nbsp; Browse apps</button><button id="installed" class="nav">✓ &nbsp; Installed apps <span id="count">0</span></button><div class="aside-bottom"><p>One home for your apps.<br>Only install what you need.</p><span id="platform"></span><button id="remove-all" class="text-danger">Uninstall RobOS…</button></div></aside>
<main><header><div><p class="eyebrow">MAKE IT YOURS</p><h1>Choose your RobOS apps</h1><p class="muted">Start small. Add what you need, whenever you need it.</p></div><button id="refresh">↻ Refresh catalog</button></header>
<div class="toolbar"><input id="search" type="search" placeholder="Search apps…" aria-label="Search apps"><label class="select-all"><input id="select-all" type="checkbox"> Select visible apps</label></div>
<div id="notice" role="status" aria-live="polite"></div><div id="tree" aria-label="RobOS app groups"><p class="empty">Loading the app catalog…</p></div>
<footer><div><strong id="selection">No apps selected</strong><p id="estimate">Choose individual apps or a whole group.</p></div><div class="footer-actions"><button id="clear">Clear selection</button><button id="install" class="primary" disabled>Install selected apps</button></div><div id="progress-area" hidden><label id="progress-label" for="progress">Preparing…</label><progress id="progress" max="100"></progress><button id="cancel">Cancel download</button></div></footer></main><script src="app.js"></script></body></html>
