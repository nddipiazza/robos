<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" role="img" aria-labelledby="t d"><title id="t">How a small local model assembles an app</title><desc id="d">Five steps. You describe the job in plain language. The small model breaks it into smaller jobs and looks each one up, company knowledge first and then the catalog. Machines then check that the pieces fit and run each piece's own tests. If nothing matches, a person or an AI builds that one piece once, it passes the gate and joins the catalog, and the lookup runs again.</desc><defs><marker id="ah-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a7c8c"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#047857"/></marker><marker id="ah-neu" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-private" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d4fd6"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs><rect width="1600" height="660" fill="#ffffff"/><text x="40" y="62" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0a7c8c" text-anchor="start" letter-spacing="3"><tspan x="40" dy="0">HOW A SMALL MODEL ASSEMBLES AN APP</tspan></text><text x="40" y="114" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="40" dy="0">The model proposes. Machines check.</tspan></text><rect x="45" y="190" width="270" height="214" rx="20" fill="#f4f7fb" stroke="#b9c6da" stroke-width="2.6"/><circle cx="81" cy="226" r="20" fill="#b9c6da" stroke="none" stroke-width="2"/><text x="81" y="233.92" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="81" dy="0">1</tspan></text><g transform="translate(243 206) scale(0.9166666666666666)" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15" r="8"/><path d="M8 42c0-10 7-15 16-15s16 5 16 15"/></g><text x="69" y="296" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="69" dy="0">You describe</tspan><tspan x="69" dy="28.749999999999996">the job</tspan></text><text x="69" y="360" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="69" dy="0">in plain language</tspan></text><path d="M319 297 L351 297" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="355" y="190" width="270" height="214" rx="20" fill="#f4f7fb" stroke="#0a7c8c" stroke-width="2.6"/><circle cx="391" cy="226" r="20" fill="#0a7c8c" stroke="none" stroke-width="2"/><text x="391" y="233.92" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="391" dy="0">2</tspan></text><g transform="translate(553 206) scale(0.9166666666666666)" fill="none" stroke="#0a7c8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="22" height="22" rx="4"/><rect x="19" y="19" width="10" height="10" rx="2"/><path d="M19 7v6M29 7v6M19 35v6M29 35v6M7 19h6M7 29h6M35 19h6M35 29h6"/></g><text x="379" y="296" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="379" dy="0">The model breaks</tspan><tspan x="379" dy="28.749999999999996">it down</tspan></text><text x="379" y="360" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="379" dy="0">into smaller jobs</tspan></text><path d="M629 297 L661 297" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="665" y="190" width="270" height="214" rx="20" fill="#f4f7fb" stroke="#0a7c8c" stroke-width="2.6"/><circle cx="701" cy="226" r="20" fill="#0a7c8c" stroke="none" stroke-width="2"/><text x="701" y="233.92" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="701" dy="0">3</tspan></text><g transform="translate(863 206) scale(0.9166666666666666)" fill="none" stroke="#0a7c8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="11"/><path d="M29 29l12 12"/></g><text x="689" y="296" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="689" dy="0">It looks up</tspan><tspan x="689" dy="28.749999999999996">each job</tspan></text><text x="689" y="360" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="689" dy="0">your company first,</tspan><tspan x="689" dy="25">then the catalog</tspan></text><path d="M939 297 L971 297" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="975" y="190" width="270" height="214" rx="20" fill="#f4f7fb" stroke="#047857" stroke-width="2.6"/><circle cx="1011" cy="226" r="20" fill="#047857" stroke="none" stroke-width="2"/><text x="1011" y="233.92" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="1011" dy="0">4</tspan></text><g transform="translate(1173 206) scale(0.9166666666666666)" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l15 6v11c0 10-6 17-15 21C15 39 9 32 9 22V11z"/><path d="M16 24l6 6 11-12"/></g><text x="999" y="296" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="999" dy="0">Machines check</tspan><tspan x="999" dy="28.749999999999996">the fit</tspan></text><text x="999" y="360" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="999" dy="0">do the inputs and</tspan><tspan x="999" dy="25">outputs match?</tspan></text><path d="M1249 297 L1281 297" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="1285" y="190" width="270" height="214" rx="20" fill="#f4f7fb" stroke="#047857" stroke-width="2.6"/><circle cx="1321" cy="226" r="20" fill="#047857" stroke="none" stroke-width="2"/><text x="1321" y="233.92" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="1321" dy="0">5</tspan></text><g transform="translate(1483 206) scale(0.9166666666666666)" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 25l10 10 18-21"/></g><text x="1309" y="296" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="1309" dy="0">Pieces run</tspan><tspan x="1309" dy="28.749999999999996">their own tests</tspan></text><text x="1309" y="360" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="1309" dy="0">every skill ships</tspan><tspan x="1309" dy="25">with its tests</tspan></text><path d="M361 424 V436 H929 V424" fill="none" stroke="#0a7c8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="645" y="470" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#0a7c8c" text-anchor="middle" letter-spacing="1.5"><tspan x="645" dy="0">THE MODEL'S JOB</tspan></text><path d="M981 424 V436 H1549 V424" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1265" y="470" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1.5"><tspan x="1265" dy="0">THE MACHINES' JOB · NO GUESSING</tspan></text><rect x="515" y="506" width="570" height="108" rx="20" fill="rgba(180,83,9,.10)" stroke="#b45309" stroke-width="2.6" stroke-dasharray="9 6"/><g transform="translate(535 536) scale(0.9166666666666666)" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="20" rx="5" stroke-dasharray="5 5"/><path d="M24 20v8M20 24h8"/></g><text x="599" y="544" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="599" dy="0">Nothing matches?</tspan></text><text x="599" y="574" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="599" dy="0">A person or an AI builds that one piece, once.</tspan></text><text x="599" y="598" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start"><tspan x="599" dy="0">It passes the gate and joins the catalog.</tspan></text><path d="M800 506 V406" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="2 0" marker-end="url(#ah-neu)" stroke-linecap="round" stroke-linejoin="round"/><text x="815" y="480" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#b45309" text-anchor="start"><tspan x="815" dy="0">then look again</tspan></text></svg>
