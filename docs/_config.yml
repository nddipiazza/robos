title: RobOS
tagline: Developer apps, a knowledge graph of your system, and reviewable agent work
description: "Documentation for RobOS: a desktop suite of developer apps, a knowledge graph of your system, and review tools that show what coding agents changed and prove it works."
url: "https://rowbose.com"
baseurl: "/v1"

# Open Graph / LinkedIn / Twitter preview
image:
  path: /assets/images/og.png
  height: 630
  width: 1200
  alt: "RobOS documentation"
twitter:
  card: summary_large_image
social:
  name: RobOS
  links:
    - "https://github.com/nddipiazza/robos"
    - "https://discord.gg/6PjxzkHujE"

remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from
  - jekyll-seo-tag

color_scheme: robos

favicon_ico: "/assets/images/favicon.ico"

aux_links:
  "rowbose.com":
    - "https://rowbose.com/"
  "GitHub":
    - "https://github.com/nddipiazza/robos"
  "Discord":
    - "https://discord.gg/6PjxzkHujE"


aux_links_new_tab: true

# Shown at the bottom of the sidebar. The guides live on the front site, not under /v1/.
nav_external_links:
  - title: "Build apps guides"
    url: "https://rowbose.com/build-apps/"
    hide_icon: true
    opens_in_new_tab: false

heading_anchors: true

nav_sort: case_insensitive

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "RobOS is open source under the <a href=\"https://github.com/nddipiazza/robos/blob/main/LICENSE\">Apache License 2.0</a>. <a href=\"https://github.com/nddipiazza/robos\">Source</a> &middot; <a href=\"https://discord.gg/6PjxzkHujE\">Discord</a>"

mermaid:
  version: "10.9.0"
  startOnLoad: false

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    block:
      line_numbers: false

# One page per RobOS app lives in _apps/ and is listed on /apps.html.
# To add a page for a new app, run: node scripts/sync-app-docs.js
collections:
  apps:
    output: true
    permalink: /apps/:name/

just_the_docs:
  collections:
    apps:
      name: Apps
      nav_exclude: true
      search_exclude: false

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og.png
        height: 630
        width: 1200
        alt: "RobOS documentation"
  - scope:
      path: ""
      type: apps
    values:
      layout: app
      nav_exclude: true

exclude:
  - project-plan/
  - issues/
  - ideas/inbox/
  - Gemfile
  - Gemfile.lock
