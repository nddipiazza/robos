<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #header .logo { font-size: 18px; }
    #header .title { font-size: 13px; font-weight: 600; color: #e6edf3; letter-spacing: 0.5px; }
    #header .sub   { font-size: 11px; color: #8b949e; margin-left: auto; }

    #app-list { padding: 8px 0; }

    .app-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .app-item:hover { background: #21262d; }
    .app-item:active { background: #2d333b; }

    .app-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #21262d;
      border-radius: 8px;
      border: 1px solid #30363d;
      flex-shrink: 0;
    }

    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 13px; font-weight: 500; color: #e6edf3; }
    .app-desc { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .app-arrow { color: #484f58; font-size: 12px; }
  </style>
</head>
<body>
  <div id="header">
    <span class="logo">⬡</span>
    <span class="title">RobOS</span>
    <span class="sub">Apps</span>
  </div>
  <div id="app-list"></div>
  <script src="app.js"></script>
</body>
</html>
