<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Book cover -->
  <rect x="10" y="6" width="40" height="52" rx="4" ry="4" fill="#1f6feb" opacity="0.9"/>
  <!-- Spine -->
  <rect x="10" y="6" width="8" height="52" rx="2" ry="2" fill="#1158c7"/>
  <!-- Pages -->
  <rect x="18" y="10" width="28" height="44" rx="1" fill="#e8f0fe"/>
  <!-- Lines -->
  <line x1="22" y1="20" x2="42" y2="20" stroke="#aac4f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="27" x2="42" y2="27" stroke="#aac4f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#aac4f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="41" x2="38" y2="41" stroke="#aac4f0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pencil -->
  <rect x="38" y="14" width="4" height="16" rx="1" transform="rotate(30 40 22)" fill="#f0c040"/>
  <polygon points="40,28 38,32 42,32" transform="rotate(30 40 22)" fill="#e08020"/>
</svg>
