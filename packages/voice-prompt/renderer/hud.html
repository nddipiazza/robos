<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobOS Voice</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="hud-body">
  <div class="hud-window">
    <!-- Draggable Header -->
    <header class="hud-header">
      <div class="hud-title-group">
        <div class="hud-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
            <line x1="8" x2="16" y1="22" y2="22"/>
          </svg>
        </div>
        <span class="hud-title">RobOS Voice</span>
        <div id="hud-status-badge" class="hud-status-badge listening" title="Voice Assistant Status">
          <span class="hud-status-dot"></span>
          <span id="hud-status-text">LISTENING</span>
        </div>
      </div>

      <div class="hud-window-controls">
        <button id="btn-clear-chat" class="hud-btn-icon" title="Clear Chat History">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </button>
        <button id="btn-pos-cycle" class="hud-btn-icon" title="Change Screen Corner (BR, BL, TL, TR)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="16" cy="16" r="2" fill="currentColor"/>
          </svg>
          <span id="pos-label" class="pos-label">BR</span>
        </button>
        <button id="btn-close-hud" class="hud-btn-icon btn-close" title="Close Overlay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Chat Feed -->
    <main id="chat-feed" class="chat-feed">
      <!-- Welcome Empty State -->
      <div id="chat-welcome" class="chat-welcome">
        <div class="welcome-avatar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
            <line x1="8" x2="16" y1="22" y2="22"/>
          </svg>
        </div>
        <div class="welcome-title">RobOS Voice Assistant</div>
        <div class="welcome-hint">Say <strong>"Hello RobOS [command]"</strong> or type below</div>
        <div class="quick-prompts">
          <button type="button" class="quick-chip" data-prompt="open task explorer">Task Explorer</button>
          <button type="button" class="quick-chip" data-prompt="what is the git status">Git Status</button>
          <button type="button" class="quick-chip" data-prompt="validate knowledge graph">Validate KGraph</button>
        </div>
      </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer class="hud-input-footer">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="Say 'Hello RobOS...' or type..."
          autocomplete="off"
        />
        <button type="button" id="btn-toggle-mic" class="btn-chat-tool active" title="Microphone Active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
            <line x1="8" x2="16" y1="22" y2="22"/>
          </svg>
        </button>
        <button type="submit" id="btn-chat-send" class="btn-chat-send" title="Send message">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="hud.js"></script>
</body>
</html>
