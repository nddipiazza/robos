title: RobOS
tagline: Knowledge Graph-First Developer Operating System & Application Suite
description: "The developer-first operating system and 30+ desktop application suite engineered for Knowledge Graph-First Application Generation and Agent Review-Based Development. Build the KGraph, and full applications become auto-generated while human architects review and approve."
url: "https://nddipiazza.github.io"
baseurl: "/robos"

# Open Graph / LinkedIn / Twitter preview
og_image: "/robos/assets/images/screenshots/robos-desktop.png"
twitter:
  card: summary_large_image

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

logo: "/assets/images/logo.png"

aux_links:
  "GitHub":
    - "https://github.com/nddipiazza/robos"

aux_links_new_tab: true

heading_anchors: true

nav_sort: case_insensitive

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "RobOS &mdash; AI-First Developer Operating System & Application Suite. Built with <a href=\"https://github.com/nddipiazza/robos\">open source standards</a>."

mermaid:
  version: "10.9.0"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - project-plan/
  - Gemfile
  - Gemfile.lock
