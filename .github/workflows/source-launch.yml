name: Source app launcher
on:
  push:
    paths: ['scripts/dev-launch*', '.github/workflows/source-launch.yml']
  pull_request:
    paths: ['scripts/dev-launch*', '.github/workflows/source-launch.yml']
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install X11 test tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb x11-utils
      - name: Exercise source launch with Electron
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/source-test" --no-package-lock --no-audit --no-fund electron@33.4.11
          export ROBOS_TEST_ELECTRON="$(node -p 'require(process.argv[1] + "/node_modules/electron")' "$RUNNER_TEMP/source-test")"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node --test scripts/dev-launch.test.cjs
          else
            node --test scripts/dev-launch.test.cjs
          fi
