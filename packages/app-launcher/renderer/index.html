<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RobOS Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay">

    <!-- ── Sidebar ── -->
    <aside id="sidebar">
      <div id="sidebar-title">APPS</div>
      <nav id="category-tree"></nav>
    </aside>

    <!-- ── Main ── -->
    <div id="main">
      <div id="topbar">
        <div id="search-wrap">
          <svg viewBox="0 0 16 16" fill="none" class="search-icon">
            <circle cx="6.5" cy="6.5" r="4.5" stroke="#6e7681" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="search" type="text" placeholder="Search apps…" autocomplete="off" spellcheck="false">
          <kbd id="esc-hint">ESC</kbd>
        </div>
        <button id="btn-close" title="Close (Esc)">✕</button>
      </div>

      <div id="grid-header"></div>
      <div id="app-grid"></div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
