<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RobOS Task Servers</title>
  <link rel="stylesheet" href="style.css">
  <script src="/usr/local/share/robos/robos-icons/builtin-apps-browser.js"></script>
</head>
<body>
<div id="app">
  <!-- Pass picker modal -->
  <div id="pass-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Select pass entry</span>
        <button id="pass-modal-close">✕</button>
      </div>
      <input id="pass-search" type="text" placeholder="Filter…" autocomplete="off">
      <ul id="pass-list"></ul>
    </div>
  </div>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span class="app-logo" id="app-logo-icon"></span>
      <span class="sidebar-title">Task Servers</span>
      <div class="add-menu-wrap">
        <button id="btn-add" title="Add server">＋</button>
        <div id="add-menu" class="add-menu hidden">
          <div class="add-item" data-type="gitea">
            <span class="type-badge gitea">Gitea</span> Gitea (Local OSS Forge)
          </div>
          <div class="add-item" data-type="jira">
            <span class="type-badge jira">Jira</span> Jira / Atlassian
          </div>
          <div class="add-item" data-type="github">
            <span class="type-badge github">GH</span> GitHub Issues
          </div>
          <div class="add-item" data-type="gitlab">
            <span class="type-badge gitlab">GL</span> GitLab Issues
          </div>
          <div class="add-item" data-type="linear">
            <span class="type-badge linear">LN</span> Linear
          </div>
          <div class="add-item" data-type="azure">
            <span class="type-badge azure">ADO</span> Azure DevOps
          </div>
        </div>
      </div>
    </div>
    <ul id="server-list"></ul>
  </aside>

  <!-- Main panel -->
  <main id="main">
    <div id="empty-state">
      <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></div>
      <p>Select a task server to configure,<br>or add a new one.</p>
    </div>
    <div id="editor" class="hidden"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
