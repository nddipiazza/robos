<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · RobOS Games</title>
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="{{ page.title }} · RobOS Games">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:image" content="{{ page.bg_poster | absolute_url }}">
  <link rel="icon" href="{{ '/v1/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" as="image" href="{{ page.bg_poster | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/games.css' | relative_url }}">
</head>
<body class="game" style="--accent: {{ page.accent | default: '#e0b252' }}">
<div class="bg" aria-hidden="true">
  <img class="bg-poster" src="{{ page.bg_poster | relative_url }}" alt="">
  <video class="bg-video" muted loop playsinline preload="none" data-src="{{ page.bg_video | relative_url }}" poster="{{ page.bg_poster | relative_url }}"></video>
  <div class="bg-scrim"></div>
</div>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{ '/games/' | relative_url }}"><img src="{{ '/assets/logo-mark.png' | relative_url }}" alt="" height="30"><span>RobOS Games</span></a>
    <nav class="links" aria-label="Games">
      <a href="{{ '/games/crpg/' | relative_url }}">Realm of Heroes CRPG</a>
      <a href="{{ '/games/tabletop-rpg/' | relative_url }}">Tabletop RPG</a>
      <a href="{{ '/games/crpg/docs/' | relative_url }}">CRPG docs</a>
      <a href="{{ '/games/tabletop-rpg/docs/' | relative_url }}">Tabletop docs</a>
    </nav>
    <div class="nav-r"><a class="btn btn-sm" href="{{ '/' | relative_url }}">RobOS home</a></div>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="g-foot">
  <div class="wrap">
    <span>Built by AI agents inside <a href="{{ '/' | relative_url }}">RobOS</a> · Apache-2.0 ·
    <a href="https://github.com/nddipiazza/robos/tree/main/games" target="_blank" rel="noopener">Source on GitHub</a> ·
    <a href="https://discord.gg/6PjxzkHujE" target="_blank" rel="noopener">Discord</a></span>
  </div>
</footer>
<script src="{{ '/assets/games.js' | relative_url }}"></script>
</body>
</html>
