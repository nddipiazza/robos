title: RobOS
description: "RobOS is an open-source app suite built on one knowledge graph: use the apps, customize any of them, or build new ones from context engineering principles. AI features inside the apps are optional."
url: "https://rowbose.com"
baseurl: ""
author: "RobOS Project"
og_image: "/assets/og.png"
keywords: "RobOS, Rowbose, rowbose.com, www.rowbose.com, open-source app suite, knowledge graph, KGraph, context engineering, Point of Sale, Auto Center, Household finances, Audio Player, Virtual DJ, Godot 4 games, AI coding agents, developer tools"

plugins:
  - jekyll-sitemap

# This is the front site at https://rowbose.com/. The classic (v1) docs are
# a separate Jekyll site in ../docs, built with baseurl /v1 and published
# under /v1/. See .github/workflows/pages.yml.
#
# The App Directory reads app front matter from ../docs/_apps. The workflow (and
# scripts/build-docs.sh) stage it into site/_apps via scripts/stage-site-data.sh; the
# collection is data only (output: false), the pages themselves live at /v1/apps/.
collections:
  apps:
    output: false

exclude:
  - README.md

# Long-form pages (the whitepaper) list only their section headings in the contents.
kramdown:
  toc_levels: [2]
