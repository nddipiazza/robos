<button class="rb-theme-toggle" id="rb-theme-toggle" type="button" aria-label="Toggle light and dark theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></svg></button>
<script>
  (function () {
    var btn = document.getElementById('rb-theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('rb2-theme', next); } catch (e) {}
      // The color scheme is a separate stylesheet, so reload to re-render diagrams in the new palette too.
      location.reload();
    });
  })();
</script>
