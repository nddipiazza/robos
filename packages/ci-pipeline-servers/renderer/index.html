<!doctype html><html><head><meta charset="utf-8"><title>CI Pipeline Servers</title><style>
*{box-sizing:border-box}body{margin:0;background:#10171f;color:#d2dce6;font:14px system-ui}header{padding:22px 28px;border-bottom:1px solid #31404c;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}main{padding:24px 28px}button,input,select{font:inherit;border:1px solid #405262;background:#182733;color:#d2dce6;border-radius:4px;padding:9px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{text-align:left;padding:12px;border-bottom:1px solid #293b49}th{color:#98afc1;font-weight:500}p,small{color:#9eb2c4}form{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-bottom:1px solid #31404c;padding-bottom:22px}label{display:flex;flex-direction:column;gap:7px}.span{grid-column:1/-1}.path{display:flex;gap:8px}.path input{flex:1;min-width:0}#status{white-space:pre-wrap}#preview{border-top:1px solid #31404c;margin-top:24px;padding-top:16px}#preview li{padding:6px}a{color:#77d6e6}[hidden]{display:none!important}</style><script src="../../robos-lib/list-controls.js" data-app="ci-pipeline-servers"></script>
</head><body>
<header><h1>CI Pipeline Servers</h1><button id="new-server">+ Add server</button></header><main>
<p>Connect a CI provider and import its pipeline definitions from a repository into your knowledge graph.</p>
<form id="server-form" hidden><label>Name<input id="name" required placeholder="e.g. Company Jenkins"></label><label>Provider<select id="provider"></select></label><label class="span">Server / organization URL<input id="url" type="url" required placeholder="https://jenkins.example.com"></label><label class="span">Credential reference (optional)<input id="credential" placeholder="Password-store or secret-manager reference; never paste a token"></label><label class="span">Knowledge graph workspace<div class="path"><input id="graph-root" placeholder="Directory containing .robos"><button type="button" id="choose-graph">Browse</button></div></label><div class="span"><button>Save server</button> <button type="button" id="cancel-edit">Cancel</button></div></form>
<robos-list-sort for="servers" label="pipeline servers"></robos-list-sort><table><thead><tr><th>Name</th><th>Provider</th><th>Endpoint</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="servers"></tbody></table><p id="status" role="status"></p>
<section id="preview" hidden><h2>Review repository import</h2><p id="import-source"></p><ul id="files"></ul><p>Imports source definitions and provenance only. It does not start builds or deploy changes.</p><button id="apply">Import into graph</button><button id="cancel-import">Cancel</button></section>
</main><script src="app.js"></script></body></html>
