<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobOS Voice</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="hud-body">
  <div class="hud-window">
    <!-- Draggable Header -->
    <header class="hud-header">
      <div class="hud-title-group">
        <div class="hud-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
            <line x1="8" x2="16" y1="22" y2="22"/>
          </svg>
        </div>
        <span class="hud-title">RobOS Voice</span>
      </div>

      <div class="hud-window-controls">
        <button id="btn-voice-commands" class="hud-btn-icon" title="Voice Activated Commands Configuration">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" x2="20" y1="19" y2="19"/>
          </svg>
        </button>
        <button id="btn-copy-all" class="hud-btn-action" title="Copy all dictated messages to clipboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copy-all-label">Copy All</span>
        </button>
        <button id="btn-clear-chat" class="hud-btn-icon" title="Clear all messages">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </button>
        <button id="btn-pos-cycle" class="hud-btn-icon" title="Change Screen Corner (BR, BL, TL, TR)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="16" cy="16" r="2" fill="currentColor"/>
          </svg>
          <span id="pos-label" class="pos-label">BR</span>
        </button>
        <button id="btn-close-hud" class="hud-btn-icon btn-close" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Prominent Record On/Off Bar -->
    <div class="record-bar">
      <button type="button" id="btn-toggle-record" class="btn-toggle-record" title="Toggle voice dictation recording">
        <span class="record-dot"></span>
        <span id="record-btn-label">Start Recording</span>
        <span class="shortcut-tag">Super+V</span>
      </button>
      <div id="record-status-hint" class="record-status-hint">Click Record or press Super+V to dictate</div>
    </div>

    <!-- Dictation Messages Feed -->
    <main id="chat-feed" class="dictation-feed">
      <!-- Empty State -->
      <div id="chat-welcome" class="dictation-welcome">
        <div class="welcome-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
            <line x1="8" x2="16" y1="22" y2="22"/>
          </svg>
        </div>
        <div class="welcome-heading">Speech Dictation</div>
        <div class="welcome-desc">Click <strong>Start Recording</strong> above and speak. Dictated text will appear here in bubbles with timestamps.</div>
      </div>
    </main>

    <!-- Voice Activated Commands Configuration Modal -->
    <div id="voice-commands-modal" class="voice-commands-modal hidden">
      <div class="commands-modal-header">
        <div class="commands-title-group">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" x2="20" y1="19" y2="19"/>
          </svg>
          <span class="commands-modal-title">Voice Activated Commands</span>
          <span id="commands-count-badge" class="commands-count-badge">0</span>
        </div>
        <button id="btn-close-commands-modal" class="hud-btn-icon" title="Close Configuration">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="commands-modal-toolbar">
        <div class="commands-search-wrap">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" x2="16.65" y1="21" y2="16.65"/>
          </svg>
          <input type="text" id="commands-search-input" placeholder="Search commands, apps, or skills..." autocomplete="off" spellcheck="false" />
          <button id="btn-clear-commands-search" class="btn-clear-search hidden">&times;</button>
        </div>
        <div class="commands-filter-tabs">
          <button class="commands-tab-btn active" data-tab="all">All</button>
          <button class="commands-tab-btn" data-tab="apps">Apps</button>
          <button class="commands-tab-btn" data-tab="skills">Skills</button>
        </div>
      </div>

      <div class="commands-modal-body" id="commands-list-container">
        <!-- Rendered list of commands -->
      </div>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
