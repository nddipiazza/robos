title: RobOS Documentation
description: AI-Powered SDLC Operating System
theme: just-the-docs

url: https://nddipiazza.github.io
baseurl: /roboto-os

aux_links:
  GitHub: https://github.com/nddipiazza/roboto-os

color_scheme: dark

nav_sort: case_insensitive

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

plugins:
  - jekyll-seo-tag
