<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Central</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      <span class="brand-name">Dev Central</span>
      <span class="ver">v2</span>
    </div>

    <button class="omni" id="omni" type="button" aria-label="Search tasks">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search all tasks, or find something to pick up…</span>
      <kbd>/</kbd>
    </button>

    <div class="top-actions">
      <button class="btn btn-primary" id="btn-find"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Find &amp; assign</button>
      <button class="btn btn-ghost icon-only" id="btn-refresh" title="Refresh" aria-label="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <div class="me-chip" id="me-chip" title="Signed in as"></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <nav class="sidebar" aria-label="Views">
      <div class="side-title">Views</div>
      <ul class="views" id="views"></ul>
      <div class="side-title">Epics</div>
      <ul class="views" id="epic-list"></ul>
    </nav>

    <main class="main">
      <div class="toolbar">
        <div class="title-block">
          <h1 id="view-title">Assigned to me</h1>
          <span class="count" id="view-count"></span>
        </div>
        <div class="tool-spacer"></div>
        <div class="inline-filter">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="q" type="text" placeholder="Filter this list…" autocomplete="off" spellcheck="false">
        </div>
        <span class="vb-label" id="vb-label">View by</span>
        <div class="seg" id="mode-seg" role="group" aria-label="View by">
          <button data-mode="epics" class="on" title="Epics with their sub-issues as a tree">Epics</button>
          <button data-mode="tasks" title="A flat list of tasks">Tasks</button>
        </div>
        <label class="grp hidden" id="grp-wrap">Group by
          <select id="groupby" class="sel">
            <option value="none">None</option><option value="epic">Epic</option><option value="status">Status</option>
            <option value="priority">Priority</option><option value="assignee">Assignee</option>
          </select>
        </label>
        <button class="btn btn-ghost" id="btn-cols" title="Choose columns (or right-click a column header)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg> Columns</button>
        <button class="btn btn-ghost" id="btn-expand" title="Expand / collapse all epics">Collapse all</button>
      </div>

      <div class="filters" id="filters"></div>

      <div class="table-wrap" id="table-wrap">
        <table class="tt" id="tt">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty hidden" id="empty"></div>
      </div>

      <footer class="statusbar">
        <span id="sb-left"></span>
        <span class="hints"><kbd>j</kbd><kbd>k</kbd> move <kbd>←</kbd><kbd>→</kbd> collapse/expand <kbd>↵</kbd> details <kbd>a</kbd> assign to me <kbd>/</kbd> search</span>
      </footer>
    </main>

    <aside class="detail hidden" id="detail" aria-label="Task details"></aside>
  </div>

  <!-- Find & assign palette -->
  <div class="scrim hidden" id="scrim">
    <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Find and assign tasks">
      <div class="pal-head">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="pal-input" type="text" placeholder="Search by title, key, #number, @person… e.g. kafka p0 is:unassigned" autocomplete="off" spellcheck="false">
        <button class="btn btn-ghost icon-only" id="pal-close" aria-label="Close">✕</button>
      </div>
      <div class="pal-filters" id="pal-filters"></div>
      <div class="pal-results" id="pal-results" role="listbox"></div>
      <div class="pal-foot">
        <span class="pal-note">Searches every task on your task servers</span>
        <span class="pal-hints"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>tab</kbd> select <kbd>↵</kbd> assign to me <kbd>⌘↵</kbd> assign selected <kbd>esc</kbd> close</span>
        <button class="btn btn-primary" id="pal-bulk" disabled>Assign selected to me</button>
      </div>
    </div>
  </div>

  <div class="ctxmenu hidden" id="ctx" role="menu"></div>

  <aside class="agent-panel hidden" id="agent-panel" role="dialog" aria-label="Agent session"></aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
