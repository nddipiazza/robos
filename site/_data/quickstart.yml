# Games a player can pick, with how to start each one.
games:
  party-game: "Install it from App Manager (Games & game tools). It needs a TV paired in Smart TV Studio and an AI agent signed in, because the AI hosts the show."
  crpg: "Runs from source with Godot 4.3: clone the repository, then run games/crpg-realm/play.sh."
  tabletop-rpg: "Install Tabletop Studio from App Manager, or run games/tabletop-rpg/play.sh from source. Needs Godot 4.3."
  robos-rts: "Runs from source with Godot 4.3 or newer: run games/robos-rts/play.sh. Press F1 for controls."
  quest-warrior-dragon: "Runs from source with Godot 4. Game Playthrough in App Manager can run and replay the AI playthrough."

