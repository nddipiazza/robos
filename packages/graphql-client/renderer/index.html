<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>RobOS GraphQL Client</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-left">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e535ab" stroke-width="1.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div>
        <h1 class="header-title">RobOS GraphQL Client</h1>
        <div class="header-subtitle">GraphiQL & Altair-inspired GraphQL Explorer</div>
      </div>
    </div>
    <div class="header-right">
      <input type="text" id="endpoint-input" class="endpoint-input mono" value="http://localhost:8443/graphql"/>
      <button class="btn btn-sm btn-primary" id="btn-run-query">▶ Execute Query (Ctrl+Enter)</button>
    </div>
  </header>

  <div id="main-layout">
    <aside id="sidebar">
      <div class="sidebar-header">Schema Documentation</div>
      <div id="schema-tree"></div>
    </aside>

    <main id="content">
      <div class="editor-pane">
        <div class="pane-header">
          <span style="font-weight:600;color:#e535ab;">GraphQL Query / Mutation</span>
          <span class="badge badge-pink">POST /graphql</span>
        </div>
        <textarea id="query-editor" class="gql-textarea mono">query GetPetProfile($petId: ID!) {
  pet(id: $petId) {
    id
    name
    species
    status
    vaccinationCertificates {
      certId
      vaccineType
      verified
      expiryDate
    }
  }
}</textarea>
        <div class="variables-pane">
          <div style="font-size:11px;color:#8b949e;margin-bottom:4px;">Query Variables (JSON):</div>
          <textarea id="variables-editor" class="vars-textarea mono">{
  "petId": "PET-105"
}</textarea>
        </div>
      </div>

      <div class="response-pane">
        <div class="pane-header">
          <span style="font-weight:600;color:#8b949e;">JSON Response</span>
          <span id="gql-stats-badge" class="badge badge-green">200 OK (160ms)</span>
        </div>
        <pre id="response-block" class="response-block mono">// Results will appear here</pre>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
