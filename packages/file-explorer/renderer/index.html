<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RobOS File Explorer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="toolbar">
    <button id="btn-back"    class="tb-btn" title="Back">◀</button>
    <button id="btn-forward" class="tb-btn" title="Forward">▶</button>
    <button id="btn-up"      class="tb-btn" title="Up">↑</button>
    <button id="btn-home"    class="tb-btn" title="Home">🏠</button>
    <div class="path-bar-wrap">
      <input id="path-bar" class="path-bar" type="text" spellcheck="false"/>
      <button id="btn-copy-path" class="tb-btn path-copy-btn" title="Copy path to clipboard">📋</button>
    </div>
    <button id="btn-refresh"  class="tb-btn" title="Refresh">↻</button>
    <button id="btn-showhide" class="tb-btn" title="Toggle hidden files">👁</button>
    <button id="btn-newdir"   class="tb-btn" title="New Folder">📁+</button>
  </div>

  <div class="body-layout">
    <!-- Sidebar tree -->
    <aside class="sidebar">
      <div class="sidebar-section-label">PLACES</div>
      <div id="places-list" class="places-list"></div>
      <div class="sidebar-section-label">BOOKMARKS</div>
      <div id="tree-root" class="tree-root"></div>
    </aside>

    <!-- Main content -->
    <div class="main-panel">
      <div id="files-list" class="files-list"></div>
    </div>

    <!-- Preview panel -->
    <div id="preview-panel" class="preview-panel hidden">
      <div class="preview-header">
        <span id="preview-name" class="preview-name"></span>
        <button id="btn-close-preview" class="tb-btn">✕</button>
      </div>
      <div id="preview-meta" class="preview-meta"></div>
      <pre id="preview-content" class="preview-content"></pre>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="status-count"></span>
    <span id="status-path"></span>
  </div>

  <!-- Inline rename input (positioned by JS) -->
  <input id="rename-input" class="rename-input hidden" type="text"/>

  <script src="app.js"></script>
</body>
</html>
