<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RobOS</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><link rel="stylesheet" href="launcher.css"></head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="wordmark.png" alt="RobOS"></div>
    <nav aria-label="App collections">
      <button class="nav-item active" data-filter="all"><span class="nav-symbol">▦</span>All applications</button>
      <button class="nav-item" data-filter="recent"><span class="nav-symbol">◷</span>Recently opened</button>
      <div class="nav-caption">COLLECTIONS</div>
      <button class="nav-item" data-filter="suites"><span class="nav-dot cyan"></span>Everyday & business</button>
      <button class="nav-item" data-filter="developer"><span class="nav-dot violet"></span>Developer tools</button>
      <button class="nav-item" data-filter="system"><span class="nav-dot amber"></span>System & agents</button>
    </nav>
    <section class="launcher-controls" aria-label="Launcher settings">
      <div class="nav-caption">QUICK ACCESS</div>
      <button id="shortcut-toggle" class="launcher-setting" aria-pressed="false" disabled>Enable Win + Shift + Space</button>
      <button id="login-toggle" class="launcher-setting" aria-pressed="false" disabled>Run at Windows sign-in</button>
      <p id="launcher-hint">Close the window to keep RobOS ready in the tray.</p>
    </section>
    <div class="sidebar-footer"><span class="online-dot"></span>Ready in the background</div>
  </aside>
  <main>
    <header class="toolbar"><div><div class="eyebrow">WORKSPACE</div><h1 id="view-title">Library</h1></div><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Search applications" aria-label="Find an app"><kbd>Ctrl K</kbd></div></header>
    <div class="content">
      <section id="suite-section"><div class="section-heading"><h2>Suites</h2></div><div id="suites" class="suite-grid"></div></section>
      <section class="directory"><div class="section-heading"><h2 id="directory-title">All applications</h2><span id="app-count"></span></div><div id="apps" class="app-grid"></div><p id="empty" hidden>No applications found.</p></section>
    </div>
    <div id="status" role="status" hidden></div>
  </main><script src="renderer.js"></script>
</body></html>
