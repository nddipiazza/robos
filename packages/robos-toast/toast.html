<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 340px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    .toast {
      width: 340px;
      background: #161b22;
      border: 1px solid #30363d;
      border-left: 4px solid #58a6ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      cursor: pointer;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      position: relative;
    }
    .toast.visible { opacity: 1; transform: translateX(0); }
    .toast.icon-error   { border-left-color: #f85149; }
    .toast.icon-warning { border-left-color: #d29922; }
    .toast.icon-success { border-left-color: #3fb950; }
    .toast.icon-start   { border-left-color: #bc8cff; }
    .toast-emoji  { font-size: 22px; flex-shrink: 0; }
    .toast-body   { flex: 1; min-width: 0; }
    .toast-title  { font-size: 13px; font-weight: 600; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast-msg    { font-size: 11px; color: #8b949e; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast-link   { display: none; font-size: 12px; color: #58a6ff; margin-top: 6px; text-decoration: underline; cursor: pointer; font-weight: 500; }
    .toast-source { font-size: 10px; color: #484f58; margin-top: 4px; }
    .toast-close  { flex-shrink: 0; color: #484f58; font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; align-self: flex-start; }
    .toast-close:hover { color: #e6edf3; background: #30363d; }
    #progress-wrap {
      position: absolute;
      bottom: 0; left: 4px; right: 0;
      height: 2px;
      background: #58a6ff44;
      border-radius: 0 0 6px 6px;
    }
    .progress-bar {
      height: 2px; background: #58a6ff; border-radius: 2px;
      width: 100%; transition: width 6s linear;
    }
    .progress-bar.shrink { width: 0%; }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="toast-emoji" id="toast-emoji">🔔</div>
    <div class="toast-body">
      <div class="toast-title"  id="toast-title">Notification</div>
      <div class="toast-msg"    id="toast-msg"></div>
      <div class="toast-link"   id="toast-link"></div>
      <div class="toast-source" id="toast-source"></div>
    </div>
    <div class="toast-close" id="toast-close">✕</div>
    <div id="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
  </div>
  <script>
    const ICONS = { info: '🔔', success: '✅', error: '❌', warning: '⚠️', start: '▶️', lock: '🔒' };
    let _action = null;

    window.toast.onData(n => {
      _action = n.action || null;
      const el = document.getElementById('toast');

      el.className = 'toast icon-' + (n.icon || 'info');
      document.getElementById('toast-emoji').textContent = ICONS[n.icon] || n.icon || '🔔';
      document.getElementById('toast-title').textContent = n.title || 'Notification';
      document.getElementById('toast-msg').textContent   = n.message || n.body || '';
      document.getElementById('toast-source').textContent = n.source ? `from ${n.source}` : '';

      const linkEl = document.getElementById('toast-link');
      if (_action && _action.label) {
        linkEl.textContent = _action.label;
        linkEl.style.display = 'block';
        // Resize window to fit link row
        window.resizeTo(340, 110);
        el.style.minHeight = '110px';
      }

      const progressWrap = document.getElementById('progress-wrap');
      if (n.sticky) {
        progressWrap.style.display = 'none';
      } else {
        const duration = n.duration || 6000;
        const pbar = document.getElementById('pbar');
        pbar.style.transition = `width ${duration / 1000}s linear`;
        setTimeout(() => pbar.classList.add('shrink'), 50);
      }

      requestAnimationFrame(() => el.classList.add('visible'));
    });

    document.getElementById('toast-link').addEventListener('click', (e) => {
      e.stopPropagation();
      if (_action) window.toast.action(_action);
    });
    document.getElementById('toast-close').addEventListener('click', (e) => {
      e.stopPropagation();
      window.toast.dismiss();
    });
    document.getElementById('toast').addEventListener('click', () => {
      if (_action) window.toast.action(_action);
      else window.toast.dismiss();
    });
  </script>
</body>
</html>
