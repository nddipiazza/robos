---
layout: default
---
<article class="paper">
  <header class="paper-h wrap-narrow">
    <p class="eyebrow">Whitepaper · The future of RobOS</p>
    <h1>{{ page.title }}</h1>
    <p class="paper-sub">{{ page.subtitle }}</p>
    <p class="paper-status">{{ page.status }}</p>
    <div class="cta cta-left">
      {%- if page.pdf %}
      <a class="btn btn-accent" href="{{ page.pdf | relative_url }}">⬇ Download the PDF</a>
      {%- endif %}
      <a class="btn btn-ghost" href="{{ '/future/' | relative_url }}">← Plain-English summary</a>
    </div>
  </header>
  <div class="prose wrap-narrow">
{{ content }}
  </div>
</article>
