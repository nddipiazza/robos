<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,500&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  .card{width:1200px;height:630px;display:grid;grid-template-rows:480px 150px;font-family:'Source Serif 4',Georgia,serif}
  .top{background:#f7f6f2;padding:72px 80px 0}
  .brand{display:flex;align-items:center;gap:20px;color:#14205e;font-size:42px;font-weight:500}
  .brand img{height:64px}
  h1{margin:52px 0 0;font-size:70px;line-height:1.08;font-weight:500;color:#1b1b1f;letter-spacing:-.01em}
  h1 em{color:#c2410c;font-style:italic}
  .bot{background:#14205e;display:flex;align-items:center;padding:0 80px;font:26px 'Fira Code',monospace;color:#f2f2f6;gap:16px}
  .bot i{color:#f97316;font-style:normal}
</style></head>
<body><div class="card">
  <div class="top">
    <div class="brand"><img src="/assets/logo-mark.png" alt=""><span>RobOS</span></div>
    <h1>One open-source app suite<br>to <em>replace them all.</em> Then less AI.</h1>
  </div>
  <div class="bot">rowbose.com <i>/</i> open source, Apache-2.0</div>
</div></body></html>
