<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';" />
  <title>RobOS VPN Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1 class="title">VPN App Launcher</h1>
        <p class="subtitle">Launch any app so its internet traffic only goes through your VPN.</p>
      </div>
      <div class="header-right">
        <div class="ip-box" style="display:flex;align-items:center;gap:8px;">
          <span class="ip-label">Your Normal IP</span>
          <strong id="normal-ip-value">—</strong>
          <button type="button" class="btn" id="btn-toggle-normal-ip" style="padding:2px 7px;font-size:11px;" title="Show or hide your full normal IP address">Show</button>
        </div>
        <button type="button" class="btn" id="btn-open-vpn-servers">VPN Servers &amp; Accounts…</button>
        <button type="button" class="btn btn-danger hidden" id="btn-stop-all">Stop All Apps</button>
      </div>
    </header>

    <div id="status-banner" class="banner hidden" role="status" aria-live="polite"></div>

    <main class="main">
      <!-- Top Bar: Choose VPN Account & Server -->
      <section class="vpn-selector-bar">
        <div class="field">
          <label for="select-account">VPN Account</label>
          <select id="select-account" class="select"></select>
        </div>
        <div class="field">
          <label for="select-server">VPN Server Location</label>
          <select id="select-server" class="select"></select>
        </div>
        <div class="field-action" style="display:flex;gap:8px;">
          <button type="button" class="btn" id="btn-check-vpn">Test VPN Connection</button>
          <button type="button" class="btn" id="btn-prove-killswitch" title="Launch isolated namespace, verify VPN IP, force-kill OpenVPN mid-flight, and prove 0 packets leak to your normal IP">Prove Kill-Switch</button>
        </div>
      </section>

      <div class="columns">
        <!-- Left Column: Quick Launch & Custom App Launch -->
        <section class="card">
          <h2 class="card-title">Launch an App</h2>

          <div class="sub-label">Saved Apps</div>
          <div id="saved-apps-list" class="list"></div>

          <div class="divider"></div>

          <div class="sub-label">Launch Another App</div>
          <div class="field">
            <label for="picker-app">Pick Installed App</label>
            <select id="picker-app" class="select">
              <option value="">Choose an installed app…</option>
            </select>
          </div>

          <div class="field">
            <label for="input-executable">Or Enter Executable Command</label>
            <div class="input-row">
              <input type="text" id="input-executable" class="input" placeholder="e.g. transmission-gtk, firefox" />
              <button type="button" class="btn" id="btn-browse">Browse…</button>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="input-args">Arguments (optional)</label>
              <input type="text" id="input-args" class="input" placeholder="Optional flags" />
            </div>
            <div class="field">
              <label for="input-profile-name">Save Name (optional)</label>
              <input type="text" id="input-profile-name" class="input" placeholder="e.g. Transmission" />
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn btn-primary btn-launch" id="btn-launch">Launch via VPN</button>
            <button type="button" class="btn" id="btn-save-profile">Save to List</button>
          </div>
        </section>

        <!-- Right Column: Running Apps & VPN Traffic Status -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Running VPN Apps</h2>
            <div style="display:flex;gap:8px;align-items:center;">
              <span class="count-pill" id="running-count">0 running</span>
              <button type="button" class="btn hidden" id="btn-clear-stopped">Clear Stopped</button>
            </div>
          </div>
          <div id="sessions-list" class="list"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
