<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" role="img" aria-labelledby="t d"><title id="t">How a skill enters the commons</title><desc id="d">Six steps. Propose a skill; look for an existing twin; check it with tests in a sandbox with time and step limits; build it reproducibly for each kind of computer; sign it and record the signature in a public log; then share it to mirrors. If a twin already exists the submission links to it instead of adding anything. If a test fails it is sent back with the failing test.</desc><defs><marker id="ah-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb0cc"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="ah-neu" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-private" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-text" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eaf0fa"/></marker></defs><rect width="1600" height="660" fill="#0b1220"/><text x="40" y="62" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="3"><tspan x="40" dy="0">HOW A SKILL ENTERS THE COMMONS</tspan></text><text x="40" y="114" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="40" dy="0">One gate, the same for people and AI.</tspan></text><rect x="44" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#2a3a5a" stroke-width="2.6"/><circle cx="78" cy="214" r="19" fill="#2a3a5a" stroke="none" stroke-width="2"/><text x="78" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#eaf0fa" text-anchor="middle"><tspan x="78" dy="0">1</tspan></text><g transform="translate(212 194) scale(0.875)" fill="none" stroke="#9fb0cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15" r="8"/><path d="M8 42c0-10 7-15 16-15s16 5 16 15"/></g><text x="64" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="64" dy="0">Propose</tspan></text><text x="64" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="64" dy="0">A person or an AI</tspan><tspan x="64" dy="24.7">submits what the</tspan><tspan x="64" dy="24.7">skill does, its tests</tspan><tspan x="64" dy="24.7">and its code.</tspan></text><path d="M279 306 L297 306" fill="none" stroke="#9fb0cc" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="300" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#22d3ee" stroke-width="2.6"/><circle cx="334" cy="214" r="19" fill="#22d3ee" stroke="none" stroke-width="2"/><text x="334" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#04121a" text-anchor="middle"><tspan x="334" dy="0">2</tspan></text><g transform="translate(468 194) scale(0.875)" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="11"/><path d="M29 29l12 12"/></g><text x="320" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="320" dy="0">Find a twin</tspan></text><text x="320" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="320" dy="0">Search by what it</tspan><tspan x="320" dy="24.7">does, not only by its</tspan><tspan x="320" dy="24.7">name.</tspan></text><path d="M535 306 L553 306" fill="none" stroke="#9fb0cc" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="556" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#34d399" stroke-width="2.6"/><circle cx="590" cy="214" r="19" fill="#34d399" stroke="none" stroke-width="2"/><text x="590" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#04121a" text-anchor="middle"><tspan x="590" dy="0">3</tspan></text><g transform="translate(724 194) scale(0.875)" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l15 6v11c0 10-6 17-15 21C15 39 9 32 9 22V11z"/><path d="M16 24l6 6 11-12"/></g><text x="576" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="576" dy="0">Check it</tspan></text><text x="576" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="576" dy="0">Tests pass. It runs</tspan><tspan x="576" dy="24.7">in a sandbox with a</tspan><tspan x="576" dy="24.7">time and step limit.</tspan></text><path d="M791 306 L809 306" fill="none" stroke="#9fb0cc" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="812" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#34d399" stroke-width="2.6"/><circle cx="846" cy="214" r="19" fill="#34d399" stroke="none" stroke-width="2"/><text x="846" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#04121a" text-anchor="middle"><tspan x="846" dy="0">4</tspan></text><g transform="translate(980 194) scale(0.875)" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l17 8v22l-17 8-17-8V13z"/><path d="M7 13l17 8 17-8M24 21v22"/></g><text x="832" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="832" dy="0">Build it</tspan></text><text x="832" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="832" dy="0">Built the same way</tspan><tspan x="832" dy="24.7">every time, for each</tspan><tspan x="832" dy="24.7">kind of computer.</tspan></text><path d="M1047 306 L1065 306" fill="none" stroke="#9fb0cc" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="1068" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#34d399" stroke-width="2.6"/><circle cx="1102" cy="214" r="19" fill="#34d399" stroke="none" stroke-width="2"/><text x="1102" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#04121a" text-anchor="middle"><tspan x="1102" dy="0">5</tspan></text><g transform="translate(1236 194) scale(0.875)" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l15 6v11c0 10-6 17-15 21C15 39 9 32 9 22V11z"/><path d="M16 24l6 6 11-12"/></g><text x="1088" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="1088" dy="0">Sign it</tspan></text><text x="1088" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="1088" dy="0">Signed, and the</tspan><tspan x="1088" dy="24.7">signature goes in a</tspan><tspan x="1088" dy="24.7">public log.</tspan></text><path d="M1303 306 L1321 306" fill="none" stroke="#9fb0cc" stroke-width="3" marker-end="url(#ah-muted)"/><rect x="1324" y="180" width="232" height="252" rx="20" fill="#111a2e" stroke="#22d3ee" stroke-width="2.6"/><circle cx="1358" cy="214" r="19" fill="#22d3ee" stroke="none" stroke-width="2"/><text x="1358" y="221.56" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#04121a" text-anchor="middle"><tspan x="1358" dy="0">6</tspan></text><g transform="translate(1492 194) scale(0.875)" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36a9 9 0 0 1 1-18 11 11 0 0 1 21 3 7.5 7.5 0 0 1-1 15z"/></g><text x="1344" y="280" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#eaf0fa" text-anchor="start"><tspan x="1344" dy="0">Share it</tspan></text><text x="1344" y="320" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb0cc" text-anchor="start"><tspan x="1344" dy="0">Copied to mirrors:</tspan><tspan x="1344" dy="24.7">yours, your</tspan><tspan x="1344" dy="24.7">company's, the</tspan><tspan x="1344" dy="24.7">world's.</tspan></text><path d="M416 436 L416 476" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#ah-ok)"/><rect x="300" y="480" width="232" height="128" rx="18" fill="rgba(52,211,153,.14)" stroke="#34d399" stroke-width="2.4"/><text x="416" y="518" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#34d399" text-anchor="middle"><tspan x="416" dy="0">Already exists</tspan></text><text x="416" y="548" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#eaf0fa" text-anchor="middle"><tspan x="416" dy="0">Link to it. Nothing</tspan><tspan x="416" dy="24.32">new is added.</tspan></text><path d="M672 436 L672 476" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#ah-neu)"/><rect x="556" y="480" width="232" height="128" rx="18" fill="rgba(251,191,36,.14)" stroke="#fbbf24" stroke-width="2.4"/><text x="672" y="518" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#fbbf24" text-anchor="middle"><tspan x="672" dy="0">A test fails</tspan></text><text x="672" y="548" font-family="Inter, 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#eaf0fa" text-anchor="middle"><tspan x="672" dy="0">Sent back with the</tspan><tspan x="672" dy="24.32">failing test attached.</tspan></text></svg>
