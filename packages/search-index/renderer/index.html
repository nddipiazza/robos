<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"/>
  <title>RobOS Search Index</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="/usr/local/share/robos/robos-icons/builtin-apps-browser.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title">
        <span class="app-logo" id="app-logo-icon"></span>
        <span>RobOS Search Index</span>
      </div>
      <div class="header-actions">
        <button id="btn-rebuild-all" class="btn btn-secondary">↻ Rebuild All</button>
        <button id="btn-add" class="btn btn-primary">+ Add Index</button>
      </div>
    </header>

    <div class="body">
      <!-- Left: index list -->
      <aside class="sidebar">
        <div class="sidebar-label">Indexes</div>
        <div id="index-list" class="index-list">
          <div class="loading">Loading…</div>
        </div>
      </aside>

      <!-- Right: detail + search -->
      <main class="detail">
        <div id="detail-empty" class="detail-empty">
          <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></div>
          <div class="empty-title">RobOS Search Index</div>
          <div class="empty-sub">Select an index to view details, or use the search panel below.</div>
        </div>
        <div id="detail-panel" class="detail-panel hidden">
          <div class="detail-header">
            <div>
              <div id="detail-name" class="detail-name"></div>
              <div id="detail-meta" class="detail-meta"></div>
            </div>
            <div class="detail-header-actions">
              <button id="btn-rebuild-sel" class="btn btn-primary">↻ Rebuild</button>
              <button id="btn-delete-sel" class="btn btn-danger hidden">Delete</button>
            </div>
          </div>
          <div id="rebuild-progress" class="rebuild-progress hidden">
            <div class="progress-bar-wrap"><div id="progress-bar" class="progress-bar"></div></div>
            <div id="progress-label" class="progress-label">Indexing…</div>
          </div>
          <div class="detail-paths-label">Indexed Paths</div>
          <div id="detail-paths" class="detail-paths"></div>
        </div>

        <!-- Search panel (always shown) -->
        <div class="search-panel">
          <div class="search-panel-label">🔎 Test Search</div>
          <div class="search-row">
            <input id="search-input" class="search-input" placeholder="Type to search across all indexes…" autocomplete="off"/>
          </div>
          <div id="search-results" class="search-results"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add index modal -->
  <div id="modal-add" class="modal hidden">
    <div class="modal-box">
      <h2>Add Custom Index</h2>
      <label class="field-label">Name</label>
      <input id="add-name" class="text-input" placeholder="My Project Files"/>
      <label class="field-label mt">Paths to index (one per line)</label>
      <textarea id="add-paths" class="text-input" rows="4" placeholder="/home/robos/Documents&#10;/home/robos/work"></textarea>
      <div id="add-error" class="error-msg hidden"></div>
      <div class="modal-actions">
        <button id="btn-add-cancel" class="btn btn-ghost">Cancel</button>
        <button id="btn-add-confirm" class="btn btn-primary">Create Index</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
