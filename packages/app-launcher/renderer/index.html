<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobOS App Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="launcher">
    <div id="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search applications..." autofocus>
    </div>
    <div id="category-bar"></div>
    <div id="app-grid"></div>
    <div id="empty-state" class="hidden">No applications found</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
