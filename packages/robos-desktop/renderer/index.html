<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RobOS Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="demo-mode">

  <!-- ── Top Menu Bar ──────────────────────────────────────────────────────── -->
  <div id="menu-bar">
    <div id="menu-bar-left">
      <button id="robos-logo-btn" class="robos-logo-btn" title="RobOS System Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        RobOS
      </button>
    </div>
    <div id="menu-bar-right">
      <button id="btn-agent-widget" class="menubar-chip-btn" title="Ephemeral Agent Swarms">
        <span class="agent-chip-icon">🤖</span>
        <span id="agent-chip-count">0 Agents</span>
      </button>
      <button id="btn-notifications" class="menubar-btn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="notif-badge" class="badge" style="display:none">0</span>
      </button>
      <div id="clock-area">
        <span id="clock-date">Mon Jan 1</span>
        <span id="clock-time">00:00</span>
      </div>
      <button id="btn-show-desktop" class="show-desktop-sliver" title="Show Desktop (Minimize All / Restore)"></button>
    </div>
  </div>

  <!-- ── Agent Sessions Popover Menu ──────────────────────────────────────── -->
  <div id="agent-menu" class="agent-menu" style="display:none">
    <div class="agent-menu-header">
      <div class="agent-menu-title">
        <span>🤖 Ephemeral Agents</span>
        <span id="agent-menu-badge" class="agent-count-badge">0 Active</span>
      </div>
      <button id="btn-wipe-all-agents" class="btn-wipe-all" title="Purge all active agent profiles">Clean All</button>
    </div>
    <div id="agent-menu-list" class="agent-menu-list">
      <div class="agent-empty">No active agent sessions running.</div>
    </div>
  </div>

  <!-- ── Desktop Center Canvas ─────────────────────────────────────────── -->
  <div id="desktop-center" class="desktop-center">
    <div class="desktop-logo-wrap">
      <svg class="desktop-brand-icon" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <h1 class="desktop-brand-title">RobOS</h1>
      <p class="desktop-brand-sub">AI-First Developer Operating System</p>
    </div>
  </div>

  <!-- ── Bottom Dock ────────────────────────────────────────────────────────── -->
  <div id="dock">
    <!-- Fixed: App Launcher -->
    <button id="btn-launcher" class="dock-btn launcher-dock-btn" title="App Launcher">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>

    <div id="dock-resize-handle" class="dock-separator" title="Drag up/down to resize dock"></div>

    <!-- Running X11 windows -->
    <div id="window-area" class="window-area"></div>
  </div>

  <!-- ── RobOS System Settings Menu ──────────────────────────────────────── -->
  <div id="sys-menu" class="sys-menu" style="display:none">
    <div class="sys-menu-section-label">RobOS Desktop</div>
    <button class="sys-menu-item" id="sys-back-to-gnome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Back to GNOME
    </button>
  </div>

  <!-- ── App launch feedback toast ─────────────────────────────────────────── -->
  <div id="launch-toast" class="launch-toast" style="display:none"></div>

  <!-- ── Live Demo Narration Subtitle Banner ──────────────────────────────── -->
  <div id="demo-subtitle-banner" class="demo-subtitle-banner"></div>

  <!-- ── Virtual Animated Cursor ─────────────────────────────────────────── -->
  <div id="virtual-cursor" class="virtual-cursor" style="display:none">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="#00bcd4" stroke="#0d1117" stroke-width="1.5">
      <path d="M3 3l7 18 3-7 7-3L3 3z"/>
    </svg>
    <div class="cursor-pulse"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
