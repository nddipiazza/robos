name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "site/**"
      - "VERSION"
      - "scripts/stage-release-data.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage release version and installation paths
        run: node scripts/stage-release-data.cjs

      # Front site -> https://rowbose.com/ (reads app data from the v1 docs)
      - name: Stage app data for the front site
        run: scripts/stage-site-data.sh

      - name: Build front site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      # Classic docs -> https://rowbose.com/v1/ (baseurl is set in docs/_config.yml)
      - name: Build classic docs (v1)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site/v1

      - name: Upload artifact
        # Validate the rendered pages before publishing them.
        run: node scripts/check-install-docs.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
