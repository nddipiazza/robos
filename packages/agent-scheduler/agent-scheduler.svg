<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#161b22" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- Clock circle -->
  <circle cx="50" cy="52" r="28" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Hour ticks -->
  <line x1="50" y1="26" x2="50" y2="31" stroke="#58a6ff" stroke-width="2"/>
  <line x1="50" y1="73" x2="50" y2="78" stroke="#58a6ff" stroke-width="2"/>
  <line x1="24" y1="52" x2="29" y2="52" stroke="#58a6ff" stroke-width="2"/>
  <line x1="71" y1="52" x2="76" y2="52" stroke="#58a6ff" stroke-width="2"/>
  <!-- Hour hand -->
  <line x1="50" y1="52" x2="50" y2="35" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="52" x2="63" y2="52" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center -->
  <circle cx="50" cy="52" r="3" fill="#58a6ff"/>
  <!-- Calendar notch top -->
  <rect x="34" y="18" width="6" height="10" rx="2" fill="#58a6ff"/>
  <rect x="60" y="18" width="6" height="10" rx="2" fill="#58a6ff"/>
  <!-- Bot spark -->
  <circle cx="74" cy="28" r="6" fill="#bc8cff" opacity="0.85"/>
  <text x="74" y="32" text-anchor="middle" font-family="sans-serif" font-size="8" fill="white">✦</text>
</svg>
