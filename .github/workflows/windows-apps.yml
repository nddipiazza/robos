name: Windows app suite
on:
  push:
    branches: [main]
    paths: ['scripts/windows/**', 'site/downloads/**', 'packages/**', '.github/workflows/windows-apps.yml']
  pull_request:
    paths: ['scripts/windows/**', 'site/downloads/**', 'packages/**', '.github/workflows/windows-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog and download routing
        run: node --test scripts/windows/setup.test.cjs scripts/windows/compatibility.test.cjs packages/software-center/windows-tools.test.js packages/robos-onboarding/read-command.test.cjs
      - name: Install the native app suite
        shell: pwsh
        run: ./site/downloads/Install-RobOS.ps1 -SourceRoot $pwd -InstallDir "$env:RUNNER_TEMP\RobOS" -NoLaunch
      - name: Install smoke-test driver
        shell: pwsh
        run: |
          Push-Location "$env:RUNNER_TEMP\RobOS\packages\robos-test"
          & "$env:RUNNER_TEMP\RobOS\runtime\node.exe" "$env:RUNNER_TEMP\RobOS\runtime\node_modules\npm\bin\npm-cli.js" install --omit=dev --no-audit --no-fund
          Pop-Location
      - name: Exercise installed apps
        shell: pwsh
        run: node scripts/windows/smoke.cjs "$env:RUNNER_TEMP\RobOS"
      - name: Audit every installed app
        shell: pwsh
        run: node scripts/windows/audit.cjs "$env:RUNNER_TEMP\RobOS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-evidence
          path: |
            run/windows-install/
            run/windows-audit/*.json
            run/windows-audit/*.png
            ${{ runner.temp }}/RobOS/install-report.json
