<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Page not found · RobOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090f;color:#f1f5f9;font:16px/1.6 system-ui,sans-serif;text-align:center}a{color:#00e5ff}</style>
<script>
  // Forward retired /v1/, /docs/ and /apps/<slug>/ paths to their root home
  // without sending real unknown URLs into a redirect loop.
  (function () {
    var p = location.pathname;
    if (p === '/404.html' || p === '/404/') return;
    var next = null;
    if (p === '/v1' || p === '/v1/' || p === '/v2' || p === '/v2/') {
      next = '/';
    } else if (/^\/v1\//.test(p)) {
      next = p.replace(/^\/v1/, '');
    } else if (p === '/docs' || p === '/docs/') {
      next = '/apps/';
    } else if (/^\/docs\//.test(p)) {
      next = p.replace(/^\/docs/, '');
    }
    if (next !== null) {
      next = next.replace(/^\/apps\/([^/]+)\/?$/, '/$1/').replace(/\/index\.html$/, '/').replace(/\.html$/, '/');
      if (!/\.[a-z0-9]+$/i.test(next) && !next.endsWith('/')) next += '/';
      if (next !== p) location.replace(next + location.search + location.hash);
    } else if (/^\/apps\/[^/]+\/?$/.test(p)) {
      next = p.replace(/^\/apps\/([^/]+)\/?$/, '/$1/');
      location.replace(next + location.search + location.hash);
    }
  })();
</script></head>
<body><main><h1>Page not found</h1><p><a href="/">RobOS home</a> · <a href="/apps/">Apps &amp; components</a></p></main></body></html>
