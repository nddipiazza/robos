<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Head -->
  <rect x="8" y="12" width="32" height="26" rx="5" ry="5" fill="#00bcd4"/>
  <!-- Eyes -->
  <circle cx="18" cy="23" r="4" fill="#1a1a2e"/>
  <circle cx="30" cy="23" r="4" fill="#1a1a2e"/>
  <!-- Eye glow -->
  <circle cx="19.5" cy="21.5" r="1.5" fill="#00e5ff"/>
  <circle cx="31.5" cy="21.5" r="1.5" fill="#00e5ff"/>
  <!-- Mouth grill slots -->
  <rect x="14" y="31" width="4"  height="3" rx="1" fill="#1a1a2e"/>
  <rect x="22" y="31" width="4"  height="3" rx="1" fill="#1a1a2e"/>
  <rect x="30" y="31" width="4"  height="3" rx="1" fill="#1a1a2e"/>
  <!-- Antenna stem -->
  <line x1="24" y1="12" x2="24" y2="5" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna tip -->
  <circle cx="24" cy="4" r="2.5" fill="#f0a500"/>
  <!-- Ears -->
  <rect x="4"  y="18" width="4" height="8" rx="2" fill="#00bcd4"/>
  <rect x="40" y="18" width="4" height="8" rx="2" fill="#00bcd4"/>
</svg>
