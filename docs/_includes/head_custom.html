<!-- Theme: same choice as rowbose.com (shared localStorage key), else the OS preference. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('rb2-theme'); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    if (t === 'dark') {
      var css = document.querySelector('[rel="stylesheet"]');
      if (css) css.setAttribute('href', '{{ "/assets/css/just-the-docs-robos-dark.css" | relative_url }}');
    }
  })();
</script>

<!-- KaTeX math -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    function initMath() {
      if (typeof renderMathInElement === 'function') {
        // No single-$ delimiter: it turned prices like "$100 -> $75" into math.
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false
        });
      } else {
        setTimeout(initMath, 150);
      }
    }
    initMath();
  });
</script>
