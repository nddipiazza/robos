<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <!-- Search circle (lens) -->
  <circle cx="27" cy="27" r="13" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="37" y1="37" x2="52" y2="52" stroke="#58a6ff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Inner dot — gives depth -->
  <circle cx="27" cy="27" r="5" fill="#58a6ff" opacity="0.18"/>
</svg>
