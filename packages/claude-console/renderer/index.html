<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>RobOS Claude Console</title>
  <link rel="stylesheet" href="style.css">
  <script src="/usr/local/share/robos/robos-icons/builtin-apps-browser.js"></script>
  <script src="/usr/local/share/robos/robos-ui/robos-ui.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div id="header">
      <div id="header-left">
        <span class="app-logo" id="app-logo-icon"></span>
        <span id="header-title">Claude Console</span>
        <span id="session-status" class="status-badge idle">Ready</span>
      </div>
      <div id="header-actions">
        <button id="btn-stop" class="btn-toolbar btn-danger" title="Stop (Esc)" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          Stop
        </button>
        <span class="separator"></span>
        <button class="btn-wm" id="btn-minimize" title="Minimize">─</button>
        <button class="btn-wm" id="btn-maximize" title="Maximize">□</button>
        <button class="btn-wm btn-close" id="btn-close" title="Close">✕</button>
      </div>
    </div>

    <!-- Main layout -->
    <div id="main">
      <!-- Sidebar -->
      <div id="sidebar">
        <div id="sidebar-header">
          <span class="sidebar-title">Sessions</span>
          <button id="btn-refresh" class="btn-icon-sm" title="Refresh">↺</button>
        </div>
        <div id="cwd-picker">
          <label>Working directory</label>
          <select id="cwd-select"></select>
        </div>
        <div id="session-list"></div>
      </div>

      <div class="panel-resizer" id="panel-resizer"></div>

      <!-- Chat area -->
      <div id="chat-area">
        <div id="messages"></div>

        <!-- Input -->
        <div id="input-area">
          <robos-ai-textarea id="prompt-input" show-commands="false"
            placeholder="Ask Claude anything… use @ to reference files"
            min-height="48"></robos-ai-textarea>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
