<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobOS Dev Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Dev Tools</h1>
      <p class="subtitle">Install and manage developer tools</p>
    </header>
    <div id="tool-list"></div>
    <div id="log-panel" class="hidden">
      <div id="log-header">
        <span id="log-title">Install Log</span>
        <button id="log-close">&times;</button>
      </div>
      <pre id="log-output"></pre>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
