<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RobOS Relational Database Management</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
          <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
        </svg>
      </div>
      <div>
        <h1 class="header-title">RobOS Relational DB Manager</h1>
        <div class="header-subtitle">DBeaver & DataGrip-inspired SQL Studio</div>
      </div>
      <div class="active-conn-badge" id="active-conn-badge">
        <span class="pulse-dot"></span>
        <span id="header-conn-text">PostgreSQL 16 · 127.0.0.1:5432/petshop (1.2ms)</span>
      </div>
    </div>

    <div class="header-right">
      <button class="btn btn-sm btn-primary" id="btn-new-query">+ New SQL Tab</button>
      <button class="btn btn-sm" id="btn-new-conn">+ Connect DB</button>
    </div>
  </header>

  <div id="main-layout">
    <!-- Sidebar / Schema Tree -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Database Explorer</span>
      </div>
      <div class="tree-root" id="connections-tree">
        <!-- Connections & Tables Tree injected here -->
      </div>
    </aside>

    <div id="resizer"></div>

    <!-- Main Workspace -->
    <main id="content">
      <!-- Tabs Bar -->
      <div class="workspace-tabs">
        <button class="ws-tab active" data-view="data" id="tab-data-btn">📊 Data: pets</button>
        <button class="ws-tab" data-view="sql" id="tab-sql-btn">⚡ SQL Console [Console 1]</button>
        <button class="ws-tab" data-view="ddl" id="tab-ddl-btn">📑 DDL & Structure</button>
      </div>

      <!-- View 1: Table Data Viewer -->
      <div id="view-data" class="view-panel active">
        <div class="data-toolbar">
          <div class="toolbar-left">
            <span class="table-title" id="current-table-label">Table: public.pets (142 rows)</span>
            <input type="text" id="data-filter-input" class="filter-input mono" placeholder="Filter: WHERE species = 'Canine'..."/>
            <button class="btn btn-sm" id="btn-apply-filter">Apply Filter</button>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-sm" id="btn-refresh-data">↻ Refresh</button>
            <button class="btn btn-sm" id="btn-export-data">Export CSV</button>
          </div>
        </div>
        <div class="grid-container">
          <table class="db-grid" id="table-data-grid">
            <thead id="grid-thead"></thead>
            <tbody id="grid-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- View 2: SQL Console -->
      <div id="view-sql" class="view-panel">
        <div class="sql-toolbar">
          <button class="btn btn-sm btn-primary" id="btn-run-sql">▶ Execute Statement (Ctrl+Enter)</button>
          <button class="btn btn-sm" id="btn-explain-sql">⚡ Explain Plan</button>
          <span class="sql-stats" id="sql-stats-text">5 rows returned in 1.4ms</span>
        </div>
        <textarea id="sql-editor" class="sql-textarea mono">SELECT id, name, species, status, microchip_id, created_at 
FROM public.pets 
WHERE status = 'AVAILABLE' 
ORDER BY id ASC;</textarea>
        <div class="sql-results-pane">
          <div class="results-meta" id="sql-results-meta">Query Results</div>
          <div class="grid-container" style="max-height: 260px;">
            <table class="db-grid" id="sql-results-grid">
              <thead id="sql-grid-thead"></thead>
              <tbody id="sql-grid-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- View 3: DDL & Table Structure -->
      <div id="view-ddl" class="view-panel">
        <div class="ddl-pane">
          <h3 style="font-size:13px;color:#c9d1d9;margin-bottom:8px;">Table Schema Definition (DDL)</h3>
          <pre class="ddl-block mono" id="ddl-content-block">-- Generated by RobOS Relational DB Manager</pre>
        </div>
      </div>

    </main>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
