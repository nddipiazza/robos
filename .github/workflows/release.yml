name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity (needed by robos-store tests)
        run: |
          git config --global user.name "RobOS CI"
          git config --global user.email "ci@robos.dev"

      - name: Install test dependencies
        run: cd packages/robos-test && npm install

      - name: Run unit tests
        run: cd packages/robos-test && npm run test:unit

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-utils xorriso

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build VM disk image and seed ISO
        run: |
          cd infra/desktop && bash build.sh

      - name: Version the release artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release

          # Packages tarball (standalone, for users who want just the apps)
          tar czf release/robos-v${VERSION}-packages.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='__pycache__' \
            -C packages .

          # Seed ISO (cloud-init provisioner — the actual installer)
          cp infra/desktop/output/seed.iso release/robos-v${VERSION}-seed.iso

          # Disk image (qcow2 — ready-to-boot VM, large file)
          cp infra/desktop/output/robos.qcow2 release/robos-v${VERSION}.qcow2

      - name: Generate checksums
        run: |
          cd release
          sha256sum robos-v* > SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## RobOS v${VERSION}"
            echo ""
            echo "### Quick Start"
            echo ""
            echo "Download \`robos-v${VERSION}.qcow2\` (VM disk image) and \`robos-v${VERSION}-seed.iso\` (installer), then:"
            echo ""
            echo '```bash'
            echo "# First boot — provisions the full RobOS desktop"
            echo "qemu-system-x86_64 -m 16G -smp \$(nproc) -enable-kvm -cpu host \\"
            echo "  -drive file=robos-v${VERSION}.qcow2,format=qcow2,if=virtio \\"
            echo "  -drive file=robos-v${VERSION}-seed.iso,format=raw,if=virtio \\"
            echo "  -netdev user,id=net0,hostfwd=tcp::2224-:22 \\"
            echo "  -device virtio-net-pci,netdev=net0 \\"
            echo "  -display gtk"
            echo ""
            echo "# After first boot completes and VM reboots, run without seed ISO:"
            echo "qemu-system-x86_64 -m 16G -smp \$(nproc) -enable-kvm -cpu host \\"
            echo "  -drive file=robos-v${VERSION}.qcow2,format=qcow2,if=virtio \\"
            echo "  -netdev user,id=net0,hostfwd=tcp::2224-:22 \\"
            echo "  -device virtio-net-pci,netdev=net0 \\"
            echo "  -display gtk"
            echo '```'
            echo ""
            echo "Or build from source: \`git clone\`, \`infra/desktop/build.sh\`, \`infra/desktop/run.sh --firstboot\`"
            echo ""
            echo "### Release Assets"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`robos-v${VERSION}.qcow2\` | Ready-to-boot VM disk image (Ubuntu 22.04 base, ~700 MB download) |"
            echo "| \`robos-v${VERSION}-seed.iso\` | Cloud-init seed ISO — provisions RobOS desktop + 30+ apps on first boot |"
            echo "| \`robos-v${VERSION}-packages.tar.gz\` | All RobOS Electron app packages (for manual install or development) |"
            echo "| \`SHA256SUMS\` | Checksums for all artifacts |"
            echo ""
            echo "### What's New"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --oneline --no-decorate
            else
              echo "Initial release."
              echo ""
              git log --oneline --no-decorate -20
            fi
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo ""
            echo "### System Requirements"
            echo ""
            echo "- QEMU/KVM with \`/dev/kvm\` access (or any hypervisor that reads qcow2)"
            echo "- 16 GB RAM, 100 GB disk space"
            echo "- SSH: port 2224 | VNC: port 5910 | SPICE: port 5932"
            echo ""
            echo "**[Documentation](https://nddipiazza.github.io/robos/)** | **[Getting Started](https://nddipiazza.github.io/robos/getting-started.html)**"
          } > release/RELEASE-NOTES.md

          {
            echo 'body<<EOFNOTES'
            cat release/RELEASE-NOTES.md
            echo 'EOFNOTES'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RobOS v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release/robos-v${{ steps.version.outputs.version }}.qcow2
            release/robos-v${{ steps.version.outputs.version }}-seed.iso
            release/robos-v${{ steps.version.outputs.version }}-packages.tar.gz
            release/SHA256SUMS
            release/RELEASE-NOTES.md
