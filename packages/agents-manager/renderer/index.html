<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>RobOS Agents</title>
<link rel="stylesheet" href="style.css"/>
<script>
  window._lastErrors = [];
  window.addEventListener('error', e => { window._lastErrors.push(e.message + ' at ' + e.filename + ':' + e.lineno); });
  (function() {
    const s = document.createElement('script');
    s.src = '../../robos-icons/builtin-apps-browser.js';
    s.onerror = () => {
      const s2 = document.createElement('script');
      s2.src = '/usr/local/share/robos/robos-icons/builtin-apps-browser.js';
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div id="app">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="app-logo" id="app-logo-icon"></span>
      <span class="sidebar-title">RobOS Agents</span>
    </div>
    <div class="sidebar-section-label">AI Providers</div>
    <div id="provider-nav"></div>
    <div class="sidebar-spacer"></div>
    <div id="active-provider-indicator"></div>
  </aside>

  <!-- Resizer -->
  <div id="resizer"></div>

  <!-- Main panel -->
  <main id="main">
    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
             stroke="#00bcd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
          <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
        </svg>
      </div>
      <h2>AI Agent Administration</h2>
      <p>Select a provider from the sidebar to view sessions and configuration.</p>
      <div id="empty-detecting" class="text-muted">Detecting installed providers...</div>
    </div>

    <!-- Provider detail pane (populated dynamically) -->
    <div id="provider-detail" class="hidden"></div>
  </main>

  <!-- Modal: Add / Edit MCP Server -->
  <div id="mcp-server-modal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="mcp-modal-title">Configure MCP Server</h3>
        <button class="modal-close" id="btn-mcp-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Server ID / Identifier</label>
          <input type="text" id="mcp-modal-id" class="form-input mono" placeholder="e.g. sentry-prod"/>
        </div>
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input type="text" id="mcp-modal-name" class="form-input" placeholder="e.g. Sentry Crash Reporter"/>
        </div>
        <div class="form-group">
          <label class="form-label">Transport Type</label>
          <select id="mcp-modal-type" class="form-input">
            <option value="stdio">stdio (Standard Input/Output process)</option>
            <option value="http">http (JSON-RPC over HTTP)</option>
            <option value="sse">sse (Server-Sent Events)</option>
          </select>
        </div>
        <div class="form-group" id="group-mcp-command">
          <label class="form-label">Executable Command / Endpoint URL</label>
          <input type="text" id="mcp-modal-command" class="form-input mono" placeholder="e.g. npx or http://localhost:19133/mcp"/>
        </div>
        <div class="form-group" id="group-mcp-args">
          <label class="form-label">Arguments (space separated)</label>
          <input type="text" id="mcp-modal-args" class="form-input mono" placeholder="e.g. -y @modelcontextprotocol/server-sentry"/>
        </div>
        <div class="form-group">
          <label class="form-label">Environment Variables (KEY=VALUE per line)</label>
          <textarea id="mcp-modal-env" class="form-textarea mono" rows="3" placeholder="SENTRY_ORG=acme-petshop&#10;NODE_ENV=production"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Authentication Type</label>
          <select id="mcp-modal-authtype" class="form-input">
            <option value="none">None (No authentication needed)</option>
            <option value="api-token">API Token / Secret Key</option>
            <option value="oauth2">OAuth 2.0</option>
            <option value="database-credentials">Database Credentials</option>
            <option value="local-ipc">Local System / IPC</option>
          </select>
        </div>
        <div class="form-group" style="margin-top:8px;">
          <label class="flags-bool-label">
            <input type="checkbox" id="mcp-modal-authenticated" class="flags-checkbox"/>
            <span class="flags-label-text">Mark as Authenticated</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" id="btn-mcp-modal-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="btn-mcp-modal-save">Save MCP Server</button>
      </div>
    </div>
  </div>

  <!-- Modal: Authenticate MCP Server -->
  <div id="mcp-auth-modal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Authenticate MCP Server</h3>
        <button class="modal-close" id="btn-mcp-auth-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="mcp-auth-desc" style="color:#8b949e;font-size:12px;margin-bottom:14px;">
          Provide credentials to authenticate this MCP server.
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-auth-token">API Token / Secret</label>
          <input type="password" id="mcp-auth-token" class="form-input mono" placeholder="Enter token or key..."/>
        </div>
        <div class="form-group">
          <label class="form-label">Account / Resource ID (Optional)</label>
          <input type="text" id="mcp-auth-account" class="form-input" placeholder="e.g. acme-corp"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" id="btn-mcp-auth-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="btn-mcp-auth-save">Authenticate & Verify</button>
      </div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
