<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}RobOS — Trust every line your agents write{% else %}{{ page.title }} · RobOS{% endif %}</title>
  <meta name="description" content="{{ page.description | default: 'RobOS is the AI-first SDLC platform: a desktop suite, a knowledge graph of your system, and proof-of-work for every agent change.' }}">
  <meta property="og:title" content="{{ page.title }} · RobOS">
  <meta property="og:image" content="{{ '/v1/assets/images/kgraph-autogen-architecture.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/v1/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script>try{var t=localStorage.getItem('rb2-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="{{ page.body_class }}">
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/v1/assets/images/robos-transparent.png' | relative_url }}" alt="" width="28" height="28"><span>RobOS</span></a>
    <nav class="links" aria-label="Primary">
      <a href="{{ '/#product' | relative_url }}">Product</a>
      <a href="{{ '/apps/' | relative_url }}">Apps</a>
      <a href="{{ '/docs/' | relative_url }}">Docs</a>
      <a href="https://github.com/nddipiazza/robos" target="_blank" rel="noopener">GitHub</a>
      <a href="https://discord.gg/6PjxzkHujE" target="_blank" rel="noopener">Community</a>
    </nav>
    <div class="nav-r">
      <button class="icon-btn" id="theme" aria-label="Toggle theme">◐</button>
      <a class="btn btn-sm" href="{{ '/download/' | relative_url }}">Download</a>
    </div>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/v1/assets/images/robos-transparent.png' | relative_url }}" alt="" width="24" height="24"><span>RobOS</span></a>
      <p class="muted">AI agents write the code.<br>RobOS makes sure you can trust it.</p>
    </div>
    <div><h4>Product</h4><a href="{{ '/download/' | relative_url }}">Download</a><a href="{{ '/apps/' | relative_url }}">App directory</a><a href="{{ '/v1/roadmap.html' | relative_url }}">Roadmap</a></div>
    <div><h4>Resources</h4><a href="{{ '/docs/' | relative_url }}">Documentation</a><a href="{{ '/v1/getting-started.html' | relative_url }}">Installation guide</a><a href="{{ '/v1/' | relative_url }}">Classic docs (v1)</a></div>
    <div><h4>Community</h4><a href="https://github.com/nddipiazza/robos" target="_blank" rel="noopener">GitHub</a><a href="https://discord.gg/6PjxzkHujE" target="_blank" rel="noopener">Discord</a><a href="{{ '/v1/about.html' | relative_url }}">About</a></div>
  </div>
  <div class="wrap muted small">Open source · Apache-2.0 · v0.0.7</div>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
