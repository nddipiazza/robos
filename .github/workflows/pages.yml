name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "site/**"
      - "VERSION"
      - "scripts/stage-release-data.cjs"
      - "scripts/check-install-docs.cjs"
      - "scripts/check-site-pages.cjs"
      - "scripts/stage-site-guides.cjs"
      - "scripts/stage-site-data.sh"
      - "scripts/sync-app-docs.js"
      - "packages/*/package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage release version and installation paths
        run: node scripts/stage-release-data.cjs

      # One site, including app/component pages and generated references.
      - name: Stage reference guides and assets
        run: scripts/stage-site-data.sh

      - name: Build front site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload artifact
        # Validate the rendered pages before publishing them.
        run: |
          node scripts/check-install-docs.cjs
          node scripts/check-site-pages.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
