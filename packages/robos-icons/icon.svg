<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <!-- palette base -->
  <ellipse cx="32" cy="36" rx="20" ry="15" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
  <!-- color blobs on palette -->
  <circle cx="20" cy="38" r="5" fill="#f44336" opacity="0.9"/>
  <circle cx="30" cy="42" r="5" fill="#4caf50" opacity="0.9"/>
  <circle cx="40" cy="38" r="5" fill="#2196f3" opacity="0.9"/>
  <circle cx="35" cy="32" r="5" fill="#ff9800" opacity="0.9"/>
  <circle cx="25" cy="32" r="5" fill="#9c27b0" opacity="0.9"/>
  <!-- thumb hole -->
  <circle cx="43" cy="46" r="4" fill="#0d1117"/>
  <!-- brush -->
  <line x1="46" y1="20" x2="26" y2="40" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="48" cy="18" rx="3.5" ry="5" transform="rotate(-45 48 18)" fill="#00bcd4"/>
</svg>
