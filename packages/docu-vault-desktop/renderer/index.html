<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuVault Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="logo">
        <span class="icon">🖥️</span>
        <h1>DocuVault Desktop</h1>
      </div>
      <span class="tagline">Your thoughts, code snippets, and ideas—safely stored locally.</span>
    </header>
    <main class="content">
      <div class="card">
        <h2>Welcome to DocuVault Desktop</h2>
        <p>Offline-first secure markdown notes, personal snippet vault, and encrypted local storage workstation tool.</p>
        <div class="status-badge">● System Status: Ready</div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
