<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Warrior — Debug Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <span class="dragon">🐉</span>
      <h1>Dragon Warrior <span class="sub">Debug Launcher</span></h1>
      <button id="btn-kill" class="kill-btn" title="Kill running game">⏹ Kill</button>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="scenes">🗺 Scenes</button>
      <button class="tab" data-tab="battle">⚔️ Battle</button>
      <button class="tab" data-tab="savestate">💾 Save States</button>
    </nav>
  </header>

  <main>
    <div id="tab-scenes" class="tab-panel active">
      <section class="presets" id="preset-list"></section>
    </div>

    <div id="tab-battle" class="tab-panel">
      <div class="battle-layout">
        <div class="battle-col">
          <h2 class="section-title">⚔️ Monster</h2>
          <div class="field">
            <label for="mon-select">Choose Enemy</label>
            <select id="mon-select"></select>
          </div>
          <div id="mon-preview" class="mon-preview"></div>
        </div>

        <div class="battle-col">
          <h2 class="section-title">🛡 Hero Stats</h2>
          <div class="stat-grid">
            <div class="field"><label for="h-hp">HP</label>
              <input id="h-hp" type="number" value="15" min="1" max="255" /></div>
            <div class="field"><label for="h-mp">MP</label>
              <input id="h-mp" type="number" value="60" min="0" max="255" /></div>
            <div class="field"><label for="h-atk">ATK</label>
              <input id="h-atk" type="number" value="4" min="1" max="255" /></div>
            <div class="field"><label for="h-def">DEF</label>
              <input id="h-def" type="number" value="2" min="1" max="255" /></div>
            <div class="field"><label for="h-agl">AGL</label>
              <input id="h-agl" type="number" value="4" min="1" max="255" /></div>
          </div>
          <div class="quick-levels">
            <span class="ql-label">Level load:</span>
            <select id="ql-select" class="ql-select">
              <option value="">— pick level —</option>
            </select>
          </div>
        </div>
      </div>

      <div class="battle-layout gear-row">
        <div class="battle-col">
          <h2 class="section-title">🗡 Weapon</h2>
          <div class="field">
            <select id="weapon-select">
              <option value="">— none —</option>
            </select>
          </div>
          <div id="weapon-preview" class="gear-preview"></div>
        </div>
        <div class="battle-col">
          <h2 class="section-title">🛡 Armor</h2>
          <div class="field">
            <select id="armor-select">
              <option value="">— none —</option>
            </select>
          </div>
          <div id="armor-preview" class="gear-preview"></div>
        </div>
      </div>

      <div class="battle-layout">
        <div class="battle-col">
          <h2 class="section-title">✨ Spells</h2>
          <div id="spell-list" class="check-grid"></div>
        </div>
        <div class="battle-col">
          <h2 class="section-title">🎒 Items</h2>
          <div id="item-list" class="item-grid"></div>
        </div>
      </div>

      <div class="battle-launch-row">
        <button id="btn-launch-battle" class="launch-btn">⚔️ Launch Battle</button>
      </div>
    </div>

    <div id="tab-savestate" class="tab-panel">
      <div class="ss-layout">
        <div class="ss-editor">
          <h2 class="section-title">🎮 Save State Editor</h2>

          <div class="ss-section">
            <h3>📍 Location</h3>
            <div class="field-row">
              <div class="field"><label>Scene</label>
                <select id="ss-scene"></select></div>
              <div class="field"><label>Tile X</label>
                <input id="ss-tile-x" type="number" value="4" min="0" max="200" /></div>
              <div class="field"><label>Tile Y</label>
                <input id="ss-tile-y" type="number" value="5" min="0" max="200" /></div>
              <div class="field"><label>Facing</label>
                <select id="ss-facing">
                  <option value="up">Up</option>
                  <option value="down">Down</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                </select></div>
              <div class="field"><label>Come From</label>
                <input id="ss-come-from" type="text" value="debug" placeholder="e.g. world_map" /></div>
            </div>
            <div class="field-row">
              <div class="field spawn-preset-field"><label>Spawn Preset</label>
                <select id="ss-spawn-preset"><option value="">— pick map spawn —</option></select></div>
            </div>
          </div>

          <div class="ss-section">
            <h3>🧙 Hero Stats</h3>
            <div class="stat-grid">
              <div class="field"><label>Name</label><input id="ss-name" type="text" value="ERDRICK" maxlength="8" /></div>
              <div class="field"><label>Level</label><input id="ss-level" type="number" value="1" min="1" max="30" /></div>
              <div class="field"><label>HP</label><input id="ss-hp" type="number" value="15" min="1" max="255" /></div>
              <div class="field"><label>HP Max</label><input id="ss-hp-max" type="number" value="15" min="1" max="255" /></div>
              <div class="field"><label>MP</label><input id="ss-mp" type="number" value="0" min="0" max="255" /></div>
              <div class="field"><label>MP Max</label><input id="ss-mp-max" type="number" value="0" min="0" max="255" /></div>
              <div class="field"><label>STR</label><input id="ss-str" type="number" value="4" min="1" max="255" /></div>
              <div class="field"><label>AGL</label><input id="ss-agl" type="number" value="4" min="1" max="255" /></div>
              <div class="field"><label>ATK</label><input id="ss-atk" type="number" value="4" min="1" max="255" /></div>
              <div class="field"><label>DEF</label><input id="ss-def" type="number" value="2" min="1" max="255" /></div>
              <div class="field"><label>EXP</label><input id="ss-exp" type="number" value="0" min="0" max="99999" /></div>
              <div class="field"><label>Gold</label><input id="ss-gold" type="number" value="0" min="0" max="99999" /></div>
            </div>
          </div>

          <div class="ss-section">
            <h3>⚔️ Equipment</h3>
            <div class="field-row">
              <div class="field"><label>Weapon</label><select id="ss-weapon"><option value="">— none —</option></select></div>
              <div class="field"><label>Armor</label><select id="ss-armor"><option value="">— none —</option></select></div>
            </div>
          </div>

          <div class="ss-section">
            <h3>✨ Spells Known</h3>
            <div id="ss-spells" class="check-grid"></div>
          </div>

          <div class="ss-section">
            <h3>🎒 Inventory</h3>
            <div class="field-row inventory-add-row">
              <select id="ss-item-add"><option value="">— add item —</option></select>
              <button id="btn-ss-add-item" class="small-btn">+ Add</button>
            </div>
            <div id="ss-inventory-list" class="inventory-list"></div>
          </div>

          <div class="ss-section">
            <h3>📦 Opened Chests</h3>
            <div class="field-row">
              <button id="btn-ss-all-chests" class="small-btn">Check All</button>
              <button id="btn-ss-no-chests" class="small-btn">Uncheck All</button>
            </div>
            <div id="ss-chests" class="check-grid small"></div>
          </div>

          <div class="ss-section">
            <h3>🚪 Unlocked Doors</h3>
            <div class="field-row">
              <button id="btn-ss-all-doors" class="small-btn">Check All</button>
              <button id="btn-ss-no-doors" class="small-btn">Uncheck All</button>
            </div>
            <div id="ss-doors" class="check-grid small"></div>
          </div>

          <div class="ss-section">
            <h3>🌈 World Flags</h3>
            <div class="field-row">
              <label class="check-label"><input type="checkbox" id="ss-bridge"> Rainbow Bridge Built</label>
            </div>
          </div>
        </div>

        <div class="ss-sidebar">
          <h2 class="section-title">💾 Saved States</h2>
          <div id="ss-file-list" class="ss-file-list"></div>
          <div class="ss-actions">
            <div class="field">
              <label>Save Name</label>
              <input id="ss-save-name" type="text" placeholder="e.g. before-charlock" />
            </div>
            <button id="btn-ss-save" class="save-btn">💾 Save State</button>
            <button id="btn-ss-launch" class="launch-btn">▶ Launch This State</button>
          </div>
        </div>
      </div>
    </div>

    <section class="log-section">
      <div class="log-header">
        <span>Console</span>
        <button id="btn-clear-log">Clear</button>
      </div>
      <pre id="log-output"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
