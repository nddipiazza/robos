<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RobOS Agent Chat</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Sidebar: Sessions & Context -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="m10 8-3 3 3 3"/>
            <path d="m14 8 3 3-3 3"/>
          </svg>
          <span class="brand-title">Agent Chat</span>
        </div>
        <button class="btn btn-icon" id="btn-new-chat" title="New Chat Session (Ctrl+N)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="sidebar-section-title">Active Threads</div>
      <div id="session-list" class="session-list"></div>

      <div class="sidebar-footer">
        <div class="workspace-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <div class="workspace-meta">
            <span class="workspace-name" id="current-workspace">acme-petshop</span>
            <span class="branch-tag" id="current-branch">feature/rabies-tracking</span>
          </div>
        </div>
        <div class="mcp-status-card" id="mcp-status-pill">
          <span class="pulse-dot"></span>
          <span><strong>32 MCP Tools</strong> Active Across 30+ Apps</span>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main id="chat-workspace" class="chat-workspace">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="model-selector-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <select id="select-model" class="model-select">
              <option value="claude-3-7-sonnet" selected>Claude 3.7 Sonnet (Anthropic)</option>
              <option value="openai-o3-mini">OpenAI o3-mini (Reasoning)</option>
              <option value="gemini-2-5-flash">Google Gemini 2.5 Flash</option>
              <option value="antigravity-harness">Antigravity Harness (DeepMind)</option>
              <option value="local-ollama">Local Ollama (Qwen 2.5 Coder 32B)</option>
            </select>
          </div>

          <div class="mode-toggles">
            <button class="mode-btn active" data-mode="agent" title="Autonomous tool use & execution across RobOS apps">🤖 Agent</button>
            <button class="mode-btn" data-mode="chat" title="Conversational explanation & question answering">💬 Chat</button>
            <button class="mode-btn" data-mode="edit" title="In-place code refactoring & semantic diffs">✏️ Edit</button>
            <button class="mode-btn" data-mode="review" title="Pull request audit & security review">🔍 Review</button>
          </div>
        </div>

        <div class="header-right">
          <button class="btn btn-popout" id="btn-popout-prompt" title="Pop Out Floating Agent Prompt (Super+Space)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00bcd4" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            <span>Pop Out Prompt</span>
          </button>
          <button class="btn btn-icon" id="btn-tools-drawer" title="Connected MCP Tools">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </button>
        </div>
      </header>

      <!-- Message History Scroll Area -->
      <div id="messages-container" class="messages-container">
        <!-- Rendered by app.js -->
      </div>

      <!-- Chat Input Area -->
      <footer class="chat-input-area">
        <!-- Context & Quick Suggestion Bar -->
        <div class="context-bar">
          <div class="chips-list">
            <span class="chip chip-context">@workspace:acme-petshop</span>
            <span class="chip chip-context">@file:PetController.java</span>
            <span class="chip chip-action" data-cmd="/explain">/explain</span>
            <span class="chip chip-action" data-cmd="/fix">/fix</span>
            <span class="chip chip-action" data-cmd="/test">/test</span>
            <span class="chip chip-action" data-cmd="/plan">/plan</span>
            <span class="chip chip-action" data-cmd="/skills">/skills</span>
          </div>
        </div>

        <div class="input-box-wrapper">
          <textarea id="chat-input" class="chat-textarea" rows="2" placeholder="Ask RobOS Agent anything, @ to mention files, / for slash commands..."></textarea>
          
          <div class="input-actions-bar">
            <div class="input-meta">
              <span class="meta-tag model-badge" id="input-model-tag">Claude 3.7 Sonnet</span>
              <span class="meta-tag token-meter" id="input-token-meter">14.2k / 200k tokens</span>
            </div>
            
            <div class="input-buttons">
              <button class="btn btn-secondary-sm" id="btn-input-popout" title="Send to Floating Desktop Prompt">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span>Prompt Popup</span>
              </button>
              <button class="btn btn-primary-send" id="btn-send-message">
                <span>Send</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </div>
      </footer>
    </main>

    <!-- Tools Modal Drawer -->
    <div id="tools-modal" class="modal-overlay hidden">
      <div class="modal-panel">
        <div class="modal-header">
          <h3>Connected RobOS MCP Tools & App Integrations</h3>
          <button class="btn-close" id="btn-close-tools">✕</button>
        </div>
        <div class="modal-body" id="tools-list-body">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
